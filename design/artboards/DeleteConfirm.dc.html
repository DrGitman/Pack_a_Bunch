<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
  body { margin:0; font-family:"Plus Jakarta Sans","Segoe UI",Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:#A65C34; } a:hover { color:#7C4223; }
</style>
</helmet>

<div style="width:412px;height:916px;overflow:hidden;background:#F7EFE6;position:relative;">

  <div style="padding:76px 20px 0 20px;">
    <div style="font-size:28px;font-weight:800;color:#2B1D14;letter-spacing:-0.7px;">Projects</div>
    <div style="height:96px;background:#FFFFFF;border-radius:24px;margin-top:26px;"></div>
    <div style="height:96px;background:#FFFFFF;border-radius:24px;margin-top:12px;"></div>
    <div style="height:96px;background:#FFFFFF;border-radius:24px;margin-top:12px;"></div>
  </div>

  <div style="position:absolute;left:0;top:0;width:412px;height:916px;background:rgba(43,29,20,0.58);"></div>

  <div style="position:absolute;left:24px;right:24px;top:264px;background:#FFFFFF;border-radius:30px;padding:26px 22px;box-shadow:0 22px 54px rgba(0,0,0,0.42);">

    <div style="display:flex;justify-content:center;">
      <div style="width:80px;height:80px;border-radius:28px;background:#FBE4DF;display:flex;align-items:center;justify-content:center;">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#B4402B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M6 7l1 13h10l1-13"/><path d="M10.5 11v5M13.5 11v5"/></svg>
      </div>
    </div>

    <div style="margin-top:20px;text-align:center;font-size:23px;line-height:29px;font-weight:800;color:#2B1D14;letter-spacing:-0.5px;text-wrap:pretty;">Delete “Camping bin”?</div>
    <div style="margin-top:10px;text-align:center;font-size:14.5px;line-height:22px;color:#7C6857;text-wrap:pretty;">This is the only copy. Nothing is backed up anywhere else.</div>

    <div style="background:#F9F4EE;border-radius:18px;padding:14px;margin-top:18px;">
      <div style="font-size:12px;font-weight:800;color:#A2907F;letter-spacing:0.6px;">GOES WITH IT</div>
      <div style="display:flex;flex-direction:column;gap:9px;margin-top:10px;">
        <div style="display:flex;align-items:center;gap:10px;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8A7565" stroke-width="2" stroke-linejoin="round" style="flex-shrink:0;"><path d="M12 3l8 4.2v9.6L12 21l-8-4.2V7.2z"/></svg>
          <span style="font-size:13.5px;color:#5C4A3A;">5 items and their measurements</span>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8A7565" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><rect x="3.5" y="5" width="17" height="14" rx="2.4"/><path d="M4 16l4.5-4.5 4 4 3-3L20 17"/></svg>
          <span style="font-size:13.5px;color:#5C4A3A;">3 photos stored in the app</span>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8A7565" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>
          <span style="font-size:13.5px;color:#5C4A3A;">Its saved arrangement and packing order</span>
        </div>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:10px;margin-top:14px;padding:0 2px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8A7565" stroke-width="2" stroke-linecap="round" style="flex-shrink:0;"><path d="M4 10h9a5 5 0 110 10H9"/><path d="M4 10l4-4M4 10l4 4"/></svg>
      <span style="font-size:13px;line-height:19px;color:#7C6857;">You get a few seconds to undo, then it's gone for good.</span>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px;margin-top:20px;">
      <button style="height:54px;border:0;border-radius:27px;background:#B4402B;color:#FFFFFF;font-family:inherit;font-size:15.5px;font-weight:700;cursor:pointer;box-shadow:0 8px 20px rgba(180,64,43,0.26);">Delete it</button>
      <button style="height:52px;border:1.5px solid #E2D5C6;border-radius:26px;background:#FFFFFF;color:#5C4A3A;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;">Keep it</button>
    </div>
  </div>
