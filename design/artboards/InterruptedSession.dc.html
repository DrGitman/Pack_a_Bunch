<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
  body { margin:0; font-family:"Plus Jakarta Sans","Segoe UI",Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:#A65C34; } a:hover { color:#7C4223; }
</style>
</helmet>

<div style="width:412px;height:916px;overflow:hidden;background:#F7EFE6;display:flex;flex-direction:column;">

  <div style="height:30px;flex-shrink:0;"></div>

  <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 20px 0 20px;">
    <div style="font-size:28px;font-weight:800;color:#2B1D14;letter-spacing:-0.7px;">Projects</div>
    <button style="width:44px;height:44px;border:0;border-radius:22px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 12px rgba(90,58,35,0.08);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5C4A3A" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h7M16 7h4M4 17h4M13 17h7"/><circle cx="13.5" cy="7" r="2.3"/><circle cx="10.5" cy="17" r="2.3"/></svg>
    </button>
  </div>

  <div style="padding:18px 20px 0 20px;">
    <div style="background:#3F2718;border-radius:28px;padding:20px;position:relative;overflow:hidden;">
      <svg width="120" height="110" viewBox="0 0 120 110" fill="none" style="position:absolute;right:-10px;bottom:-14px;opacity:0.55;">
        <path d="M14 46 L60 22 L106 46 L60 70 Z" fill="#6B4A32"/>
        <path d="M14 46 L60 70 L60 98 L14 74 Z" fill="#59392A"/>
        <path d="M60 70 L106 46 L106 74 L60 98 Z" fill="#4A2E1F"/>
      </svg>

      <div style="display:inline-flex;align-items:center;gap:7px;background:rgba(224,138,70,0.18);border-radius:999px;padding:6px 12px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#E8A76B" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg>
        <span style="font-size:11px;font-weight:800;color:#E8A76B;letter-spacing:0.6px;">PICK UP WHERE YOU LEFT OFF</span>
      </div>

      <div style="margin-top:14px;font-size:22px;line-height:28px;font-weight:800;color:#F7EFE6;letter-spacing:-0.5px;max-width:250px;text-wrap:pretty;">You were half way through the moving crate</div>
      <div style="margin-top:9px;font-size:14px;line-height:21px;color:#C9B29E;max-width:250px;text-wrap:pretty;">The app closed during packing. Everything up to step 3 was saved.</div>

      <div style="display:flex;gap:8px;margin-top:14px;">
        <span style="font-size:11.5px;font-weight:700;color:#F7EFE6;background:rgba(247,239,230,0.14);border-radius:999px;padding:6px 11px;">Step 3 of 6</span>
        <span style="font-size:11.5px;font-weight:700;color:#F7EFE6;background:rgba(247,239,230,0.14);border-radius:999px;padding:6px 11px;">2 pieces in</span>
      </div>

      <div style="display:flex;gap:9px;margin-top:18px;position:relative;">
        <button style="flex-grow:1;height:50px;border:0;border-radius:25px;background:#E08A46;color:#3F2718;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;">Carry on packing</button>
        <button style="height:50px;padding:0 18px;border:1.5px solid rgba(247,239,230,0.28);border-radius:25px;background:transparent;color:#E7D8C7;font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;">Start over</button>
      </div>
    </div>
  </div>

  <div style="padding:22px 20px 0 20px;font-size:12.5px;font-weight:700;color:#A2907F;letter-spacing:0.8px;">ALL PACKS</div>

  <div style="display:flex;flex-direction:column;gap:12px;padding:10px 20px 0 20px;">
    <div style="background:#FFFFFF;border-radius:24px;padding:14px;display:flex;gap:14px;align-items:center;box-shadow:0 8px 22px rgba(90,58,35,0.08);">
      <div style="width:68px;height:68px;border-radius:18px;background:#F5E4D6;flex-shrink:0;display:flex;align-items:center;justify-content:center;">
        <svg width="46" height="46" viewBox="0 0 60 60" fill="none">
          <path d="M8 24 L30 13 L52 24 L30 35 Z" fill="#E7CFB6"/>
          <path d="M8 24 L30 35 L30 49 L8 38 Z" fill="#B4713F"/>
          <path d="M30 35 L52 24 L52 38 L30 49 Z" fill="#99552C"/>
          <path d="M22 22 L30 26 L22 30 L14 26 Z" fill="#3F7A5A"/>
        </svg>
      </div>
      <div style="flex-grow:1;min-width:0;">
        <div style="display:flex;align-items:center;gap:8px;">
          <div style="font-size:16px;font-weight:700;color:#2B1D14;">Moving crate</div>
          <span style="font-size:10px;font-weight:800;color:#8A5A10;background:#FAEEDA;border-radius:999px;padding:3px 8px;letter-spacing:0.4px;">IN PROGRESS</span>
        </div>
        <div style="font-size:13px;color:#8A7565;margin-top:3px;">Storage crate · 7 pieces · a moment ago</div>
      </div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C3B0A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M9 6l6 6-6 6"/></svg>
    </div>

    <div style="background:#FFFFFF;border-radius:24px;padding:14px;display:flex;gap:14px;align-items:center;box-shadow:0 8px 22px rgba(90,58,35,0.08);">
      <div style="width:68px;height:68px;border-radius:18px;background:#F5E4D6;flex-shrink:0;display:flex;align-items:center;justify-content:center;">
        <svg width="46" height="46" viewBox="0 0 60 60" fill="none">
          <path d="M10 26 L30 16 L50 26 L30 36 Z" fill="#E7CFB6"/>
          <path d="M10 26 L30 36 L30 47 L10 37 Z" fill="#B4713F"/>
          <path d="M30 36 L50 26 L50 37 L30 47 Z" fill="#99552C"/>
          <path d="M24 24 L32 28 L24 32 L16 28 Z" fill="#B4761A"/>
        </svg>
      </div>
      <div style="flex-grow:1;min-width:0;">
        <div style="font-size:16px;font-weight:700;color:#2B1D14;">Camping bin</div>
        <div style="font-size:13px;color:#8A7565;margin-top:2px;">Storage box · 5 items · 6 h ago</div>
      </div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C3B0A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M9 6l6 6-6 6"/></svg>
    </div>
  </div>

  <div style="flex-grow:1;"></div>

  <div style="display:flex;justify-content:center;padding:0 20px 30px 20px;">
    <div style="display:flex;align-items:center;gap:6px;background:#3F2718;border-radius:34px;padding:8px 10px;box-shadow:0 12px 30px rgba(63,39,24,0.30);">
      <div style="display:flex;align-items:center;gap:8px;background:#FFFFFF;border-radius:26px;height:52px;padding:0 20px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A65C34" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h7v7H4zM13 6h7v4h-7zM13 13h7v5h-7zM4 15h7v3H4z"/></svg>
        <span style="font-size:14px;font-weight:700;color:#2B1D14;">Projects</span>
      </div>
      <button style="width:56px;height:56px;border:0;border-radius:28px;background:#E08A46;display:flex;align-items:center;justify-content:center;cursor:pointer;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3F2718" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button style="width:52px;height:52px;border:0;border-radius:26px;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#C9B29E" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h7M16 7h4M4 17h4M13 17h7"/><circle cx="13.5" cy="7" r="2.3"/><circle cx="10.5" cy="17" r="2.3"/></svg>
      </button>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
