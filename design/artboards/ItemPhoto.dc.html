<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
  body { margin:0; font-family:"Plus Jakarta Sans","Segoe UI",Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:#A65C34; } a:hover { color:#7C4223; }
</style>
</helmet>

<div style="width:412px;height:916px;overflow:hidden;background:#211D19;position:relative;">

  <svg width="412" height="916" viewBox="0 0 412 916" fill="none" style="position:absolute;left:0;top:0;">
    <rect x="0" y="0" width="412" height="430" fill="#38322C"/>
    <rect x="0" y="430" width="412" height="486" fill="#5B5147"/>
    <path d="M0 430 L412 430" stroke="#6B6055" stroke-width="1.5"/>
    <path d="M0 560 L412 560 M0 690 L412 690" stroke="#544A41" stroke-width="1.2" opacity="0.6"/>
    <ellipse cx="206" cy="640" rx="150" ry="34" fill="#4A4139"/>

    <path d="M96 520 L206 466 L316 520 L206 574 Z" fill="#D9C5AC"/>
    <path d="M96 520 L206 574 L206 646 L96 592 Z" fill="#BCA487"/>
    <path d="M206 574 L316 520 L316 592 L206 646 Z" fill="#A68C6E"/>
    <path d="M96 520 L206 466 L316 520 L206 574 Z" fill="none" stroke="#EBDCC6" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M142 496 L262 496" stroke="#C6B096" stroke-width="1.4" opacity="0.7"/>
    <path d="M96 592 L206 646 L316 592" fill="none" stroke="#8E765B" stroke-width="1.4"/>

    <g stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" opacity="0.95">
      <path d="M64 494 L64 462 L96 462"/>
      <path d="M348 494 L348 462 L316 462"/>
      <path d="M64 618 L64 650 L96 650"/>
      <path d="M348 618 L348 650 L316 650"/>
    </g>
  </svg>

  <div style="position:absolute;left:0;top:0;width:412px;height:190px;background:linear-gradient(180deg, rgba(20,16,12,0.6), rgba(20,16,12,0));"></div>

  <div style="position:absolute;left:16px;top:44px;right:16px;display:flex;align-items:center;justify-content:space-between;">
    <button style="width:46px;height:46px;border:0;border-radius:23px;background:rgba(30,24,18,0.6);display:flex;align-items:center;justify-content:center;cursor:pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <div style="font-size:15px;font-weight:700;color:#FFFFFF;">Photo of the item</div>
    <button style="width:46px;height:46px;border:0;border-radius:23px;background:rgba(30,24,18,0.6);display:flex;align-items:center;justify-content:center;cursor:pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"><path d="M9.2 9a2.9 2.9 0 115.6 1c0 2-2.8 2.4-2.8 4.4"/><circle cx="12" cy="18" r="1" fill="#FFFFFF" stroke="none"/></svg>
    </button>
  </div>

  <div style="position:absolute;left:0;top:404px;width:412px;display:flex;justify-content:center;">
    <div style="background:rgba(30,24,18,0.68);border-radius:999px;padding:9px 16px;">
      <span style="font-size:12.5px;font-weight:600;color:#FFFFFF;">Fill the frame with one item</span>
    </div>
  </div>

  <div style="position:absolute;left:0;bottom:0;width:412px;background:#FFFFFF;border-radius:30px 30px 0 0;padding:16px 20px 0 20px;box-sizing:border-box;box-shadow:0 -12px 32px rgba(0,0,0,0.32);">
    <div style="display:flex;justify-content:center;">
      <div style="width:40px;height:4px;border-radius:999px;background:#E2D5C6;"></div>
    </div>

    <div style="display:flex;gap:12px;align-items:flex-start;background:#FAEEDA;border-radius:18px;padding:14px;margin-top:16px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A5A10" stroke-width="2" stroke-linecap="round" style="flex-shrink:0;margin-top:1px;"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="7.8" r="0.9" fill="#8A5A10" stroke="none"/></svg>
      <div style="font-size:13.5px;line-height:20px;color:#7A5A25;text-wrap:pretty;">A photo helps you recognise the item later. It <strong style="color:#6E4708;">doesn't</strong> set the size — you still measure or type that yourself.</div>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;">
      <button style="width:56px;height:56px;border:1.5px solid #E2D5C6;border-radius:28px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5C4A3A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="2.4"/><path d="M4 16l4.5-4.5 4 4 3-3L20 17"/><circle cx="9" cy="9.4" r="1.4"/></svg>
      </button>
      <button style="width:76px;height:76px;border:5px solid #F1E5D8;border-radius:38px;background:#A65C34;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 10px 22px rgba(166,92,52,0.35);">
        <div style="width:44px;height:44px;border-radius:22px;background:#FFFFFF;"></div>
      </button>
      <button style="width:56px;height:56px;border:1.5px solid #E2D5C6;border-radius:28px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5C4A3A" stroke-width="1.9" stroke-linejoin="round"><path d="M13 3L5 14h5l-1 7 8-11h-5l1-7z"/></svg>
      </button>
    </div>

    <button style="width:100%;height:48px;margin-top:8px;border:0;border-radius:24px;background:transparent;color:#7C4223;font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;">Skip the photo</button>

    <div style="height:26px;"></div>
  </div>
</div>
</x-dc>
</body>
</html>
