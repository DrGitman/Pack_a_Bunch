<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
  body { margin:0; font-family:"Plus Jakarta Sans","Segoe UI",Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:#A65C34; } a:hover { color:#7C4223; }
</style>
</helmet>

<div style="width:412px;height:916px;overflow:hidden;background:#F7EFE6;display:flex;flex-direction:column;">

  <div style="height:30px;flex-shrink:0;"></div>

  <div style="display:flex;align-items:center;gap:6px;padding:6px 16px 0 12px;">
    <button style="width:44px;height:44px;border:0;border-radius:22px;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B1D14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19l-7-7 7-7"/></svg>
    </button>
    <div style="font-size:18px;font-weight:700;color:#2B1D14;flex-grow:1;">Items</div>
    <span style="font-size:13px;font-weight:600;color:#8A7565;">4 of 20</span>
  </div>

  <div style="padding:12px 20px 0 20px;">
    <div style="display:flex;gap:6px;">
      <div style="height:5px;flex-grow:1;border-radius:999px;background:#A65C34;"></div>
      <div style="height:5px;flex-grow:1;border-radius:999px;background:#A65C34;"></div>
      <div style="height:5px;flex-grow:1;border-radius:999px;background:#E7DACA;"></div>
    </div>
  </div>

  <div style="padding:14px 20px 0 20px;">
    <div style="display:flex;align-items:center;gap:11px;background:#F0E5D9;border-radius:18px;padding:11px 14px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7C4223" stroke-width="1.8" stroke-linejoin="round" style="flex-shrink:0;"><path d="M12 3l8 4.2v9.6L12 21l-8-4.2V7.2z"/><path d="M4 7.2l8 4.2 8-4.2"/><path d="M12 11.4V21"/></svg>
      <div style="flex-grow:1;">
        <div style="font-size:14px;font-weight:700;color:#2B1D14;">Moving crate</div>
      </div>
      <span style="font-family:'DM Mono',ui-monospace,monospace;font-size:12px;color:#5C4A3A;background:#FFFFFF;border-radius:999px;padding:5px 10px;">58×40×35 cm</span>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px;padding:16px 20px 0 20px;overflow:hidden;">

    <div style="background:#FFFFFF;border-radius:22px;padding:12px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 18px rgba(90,58,35,0.07);">
      <div style="width:56px;height:56px;border-radius:16px;background:#F2E0D4;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#A65C34" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3l8 4.2v9.6L12 21l-8-4.2V7.2z"/><path d="M4 7.2l8 4.2 8-4.2"/><path d="M12 11.4V21"/></svg>
        <div style="position:absolute;left:-5px;top:-5px;width:22px;height:22px;border-radius:11px;background:#A65C34;color:#FFFFFF;font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #FFFFFF;">1</div>
      </div>
      <div style="flex-grow:1;min-width:0;">
        <div style="font-size:15.5px;font-weight:700;color:#2B1D14;">Toolbox</div>
        <div style="font-family:'DM Mono',ui-monospace,monospace;font-size:12.5px;color:#8A7565;margin-top:3px;">40 × 22 × 20 cm</div>
        <div style="display:flex;gap:5px;margin-top:7px;">
          <span style="font-size:10.5px;font-weight:600;color:#5C4A3A;background:#F4EDE4;border-radius:999px;padding:3px 8px;">Keep upright</span>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;background:#F4EDE4;border-radius:999px;padding:4px;flex-shrink:0;">
        <button style="width:30px;height:30px;border:0;border-radius:15px;background:#FFFFFF;color:#5C4A3A;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;">−</button>
        <span style="font-family:'DM Mono',ui-monospace,monospace;font-size:14px;color:#2B1D14;min-width:12px;text-align:center;">1</span>
        <button style="width:30px;height:30px;border:0;border-radius:15px;background:#FFFFFF;color:#5C4A3A;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;">+</button>
      </div>
    </div>

    <div style="background:#FFFFFF;border-radius:22px;padding:12px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 18px rgba(90,58,35,0.07);">
      <div style="width:56px;height:56px;border-radius:16px;background:#E1EEE7;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#3F7A5A" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3l8 4.2v9.6L12 21l-8-4.2V7.2z"/><path d="M4 7.2l8 4.2 8-4.2"/><path d="M12 11.4V21"/></svg>
        <div style="position:absolute;left:-5px;top:-5px;width:22px;height:22px;border-radius:11px;background:#3F7A5A;color:#FFFFFF;font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #FFFFFF;">2</div>
      </div>
      <div style="flex-grow:1;min-width:0;">
        <div style="font-size:15.5px;font-weight:700;color:#2B1D14;">Shoe box</div>
        <div style="font-family:'DM Mono',ui-monospace,monospace;font-size:12.5px;color:#8A7565;margin-top:3px;">33 × 20 × 12 cm</div>
        <div style="display:flex;gap:5px;margin-top:7px;">
          <span style="font-size:10.5px;font-weight:600;color:#5C4A3A;background:#F4EDE4;border-radius:999px;padding:3px 8px;">Can turn any way</span>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;background:#F4EDE4;border-radius:999px;padding:4px;flex-shrink:0;">
        <button style="width:30px;height:30px;border:0;border-radius:15px;background:#FFFFFF;color:#5C4A3A;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;">−</button>
        <span style="font-family:'DM Mono',ui-monospace,monospace;font-size:14px;color:#2B1D14;min-width:12px;text-align:center;">3</span>
        <button style="width:30px;height:30px;border:0;border-radius:15px;background:#FFFFFF;color:#5C4A3A;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;">+</button>
      </div>
    </div>

    <div style="background:#FFFFFF;border-radius:22px;padding:12px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 18px rgba(90,58,35,0.07);">
      <div style="width:56px;height:56px;border-radius:16px;background:#E2E8F3;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#3C5C9E" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3l8 4.2v9.6L12 21l-8-4.2V7.2z"/><path d="M4 7.2l8 4.2 8-4.2"/><path d="M12 11.4V21"/></svg>
        <div style="position:absolute;left:-5px;top:-5px;width:22px;height:22px;border-radius:11px;background:#3C5C9E;color:#FFFFFF;font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #FFFFFF;">3</div>
      </div>
      <div style="flex-grow:1;min-width:0;">
        <div style="font-size:15.5px;font-weight:700;color:#2B1D14;">Board game</div>
        <div style="font-family:'DM Mono',ui-monospace,monospace;font-size:12.5px;color:#8A7565;margin-top:3px;">30 × 30 × 7 cm</div>
        <div style="display:flex;gap:5px;margin-top:7px;">
          <span style="font-size:10.5px;font-weight:600;color:#5C4A3A;background:#F4EDE4;border-radius:999px;padding:3px 8px;">Nothing on top</span>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;background:#F4EDE4;border-radius:999px;padding:4px;flex-shrink:0;">
        <button style="width:30px;height:30px;border:0;border-radius:15px;background:#FFFFFF;color:#5C4A3A;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;">−</button>
        <span style="font-family:'DM Mono',ui-monospace,monospace;font-size:14px;color:#2B1D14;min-width:12px;text-align:center;">2</span>
        <button style="width:30px;height:30px;border:0;border-radius:15px;background:#FFFFFF;color:#5C4A3A;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;">+</button>
      </div>
    </div>

    <div style="background:#FFFFFF;border-radius:22px;padding:12px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 18px rgba(90,58,35,0.07);">
      <div style="width:56px;height:56px;border-radius:16px;background:#FAEEDA;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#B4761A" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3l8 4.2v9.6L12 21l-8-4.2V7.2z"/><path d="M4 7.2l8 4.2 8-4.2"/><path d="M12 11.4V21"/></svg>
        <div style="position:absolute;left:-5px;top:-5px;width:22px;height:22px;border-radius:11px;background:#B4761A;color:#FFFFFF;font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #FFFFFF;">4</div>
      </div>
      <div style="flex-grow:1;min-width:0;">
        <div style="font-size:15.5px;font-weight:700;color:#2B1D14;">Camping stove</div>
        <div style="font-family:'DM Mono',ui-monospace,monospace;font-size:12.5px;color:#8A7565;margin-top:3px;">36 × 30 × 11 cm</div>
        <div style="display:flex;gap:5px;margin-top:7px;">
          <span style="font-size:10.5px;font-weight:600;color:#5C4A3A;background:#F4EDE4;border-radius:999px;padding:3px 8px;">Keep upright</span>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;background:#F4EDE4;border-radius:999px;padding:4px;flex-shrink:0;">
        <button style="width:30px;height:30px;border:0;border-radius:15px;background:#FFFFFF;color:#5C4A3A;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;">−</button>
        <span style="font-family:'DM Mono',ui-monospace,monospace;font-size:14px;color:#2B1D14;min-width:12px;text-align:center;">1</span>
        <button style="width:30px;height:30px;border:0;border-radius:15px;background:#FFFFFF;color:#5C4A3A;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;">+</button>
      </div>
    </div>

    <button style="height:56px;border:1.6px dashed #D3BEA6;border-radius:22px;background:transparent;color:#7C4223;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A65C34" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Add an item
    </button>
  </div>

  <div style="flex-grow:1;"></div>

  <div style="padding:14px 20px 0 20px;background:#F7EFE6;">
    <button style="width:100%;height:56px;border:0;border-radius:28px;background:#A65C34;color:#FFFFFF;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 8px 20px rgba(166,92,52,0.28);display:flex;align-items:center;justify-content:center;gap:10px;">
      Plan the pack
      <span style="background:rgba(255,255,255,0.22);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;">7 pieces</span>
    </button>
  </div>

  <div style="height:28px;flex-shrink:0;"></div>
</div>
</x-dc>
</body>
</html>
