<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
  body { margin:0; font-family:"Plus Jakarta Sans","Segoe UI",Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:#A65C34; } a:hover { color:#7C4223; }
</style>
</helmet>

<div style="width:412px;height:916px;overflow:hidden;background:#F7EFE6;position:relative;">

  <div style="padding:76px 20px 0 20px;">
    <div style="font-size:28px;font-weight:800;color:#2B1D14;letter-spacing:-0.7px;">Projects</div>
    <div style="height:96px;background:#FFFFFF;border-radius:24px;margin-top:26px;"></div>
    <div style="height:96px;background:#FFFFFF;border-radius:24px;margin-top:12px;"></div>
  </div>

  <div style="position:absolute;left:0;top:0;width:412px;height:916px;background:rgba(43,29,20,0.5);"></div>

  <div style="position:absolute;left:0;bottom:0;width:412px;background:#FFFFFF;border-radius:30px 30px 0 0;box-sizing:border-box;padding:14px 20px 0 20px;box-shadow:0 -14px 40px rgba(43,29,20,0.26);">

    <div style="display:flex;justify-content:center;">
      <div style="width:40px;height:4px;border-radius:999px;background:#E2D5C6;"></div>
    </div>

    <div style="display:flex;justify-content:center;margin-top:22px;">
      <div style="width:80px;height:80px;border-radius:28px;background:#F5E4D6;display:flex;align-items:center;justify-content:center;">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#A65C34" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h7v7H4zM13 6h7v4h-7zM13 13h7v5h-7zM4 15h7v3H4z"/></svg>
      </div>
    </div>

    <div style="margin-top:20px;text-align:center;font-size:23px;line-height:29px;font-weight:800;color:#2B1D14;letter-spacing:-0.5px;text-wrap:pretty;">Your free slot is taken</div>
    <div style="margin-top:10px;text-align:center;font-size:14.5px;line-height:22px;color:#7C6857;text-wrap:pretty;">Free keeps one pack at a time. This new one is planned and ready — it just needs somewhere to live.</div>

    <div style="background:#F9F4EE;border-radius:20px;padding:14px;margin-top:18px;display:flex;gap:13px;align-items:center;">
      <div style="width:52px;height:52px;border-radius:16px;background:#F5E4D6;flex-shrink:0;display:flex;align-items:center;justify-content:center;">
        <svg width="34" height="34" viewBox="0 0 60 60" fill="none">
          <path d="M8 24 L30 13 L52 24 L30 35 Z" fill="#E7CFB6"/>
          <path d="M8 24 L30 35 L30 49 L8 38 Z" fill="#B4713F"/>
          <path d="M30 35 L52 24 L52 38 L30 49 Z" fill="#99552C"/>
        </svg>
      </div>
      <div style="flex-grow:1;min-width:0;">
        <div style="font-size:11.5px;font-weight:800;color:#A2907F;letter-spacing:0.5px;">CURRENTLY SAVED</div>
        <div style="font-size:15px;font-weight:700;color:#2B1D14;margin-top:4px;">Moving crate</div>
        <div style="font-size:12.5px;color:#8A7565;margin-top:2px;">7 pieces · packed 2 days ago</div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px;margin-top:18px;">
      <button style="height:54px;border:0;border-radius:27px;background:#A65C34;color:#FFFFFF;font-family:inherit;font-size:15.5px;font-weight:700;cursor:pointer;box-shadow:0 8px 20px rgba(166,92,52,0.28);display:flex;align-items:center;justify-content:center;gap:9px;">
        Keep both with Pack Plus
        <span style="background:rgba(255,255,255,0.22);border-radius:999px;padding:3px 9px;font-size:12.5px;font-weight:700;">N$ 74,99 / mo</span>
      </button>
      <button style="height:52px;border:1.5px solid #E2D5C6;border-radius:26px;background:#FFFFFF;color:#5C4A3A;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;">Replace the moving crate</button>
      <button style="height:48px;border:0;border-radius:24px;background:transparent;color:#7C4223;font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;">Compare the two plans</button>
    </div>

    <div style="display:flex;align-items:center;gap:11px;background:#F0E5D9;border-radius:18px;padding:13px 15px;margin-top:16px;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#7C4223" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M20 6L9 17l-5-5"/></svg>
      <div style="font-size:13px;line-height:19px;color:#6B5849;">You can still pack this one now without saving it.</div>
    </div>

    <div style="height:30px;"></div>
  </div>
</div>
</x-dc>
</body>
</html>
