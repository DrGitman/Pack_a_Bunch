<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
  body { margin:0; font-family:"Plus Jakarta Sans","Segoe UI",Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:#A65C34; } a:hover { color:#7C4223; }
</style>
</helmet>

<div style="width:412px;height:916px;overflow:hidden;background:#16130F;position:relative;">

  <svg width="412" height="916" viewBox="0 0 412 916" fill="none" style="position:absolute;left:0;top:0;">
    <rect x="0" y="0" width="412" height="470" fill="#221E1A"/>
    <rect x="0" y="470" width="412" height="446" fill="#2A2521"/>
    <ellipse cx="206" cy="700" rx="190" ry="52" fill="#241F1B"/>
    <path d="M76 495 L206 430 L206 510 L76 575 Z" fill="#332B23"/>
    <path d="M206 430 L336 495 L336 575 L206 510 Z" fill="#3A3128"/>
    <path d="M76 575 L206 510 L336 575 L206 640 Z" fill="#241E18"/>
    <path d="M76 495 L206 560 L206 710 L76 645 Z" fill="#2E251D"/>
    <path d="M206 560 L336 495 L336 645 L206 710 Z" fill="#251E17"/>
    <path d="M76 495 L206 430 L336 495 L206 560 Z" fill="none" stroke="#40372D" stroke-width="2" stroke-linejoin="round"/>
    <path d="M76 495 L206 560 L336 495" fill="none" stroke="#40372D" stroke-width="1.6"/>

    <path d="M76 495 L206 560" stroke="#7E6A52" stroke-width="3" stroke-linecap="round"/>
    <circle cx="76" cy="495" r="6" fill="#8C7A63"/>
    <circle cx="206" cy="560" r="6" fill="#8C7A63"/>

    <g stroke="#6E5F4C" stroke-width="2.2" fill="none">
      <circle cx="300" cy="520" r="22"/>
      <path d="M300 490v14M300 536v14M270 520h14M316 520h14"/>
    </g>
  </svg>

  <div style="position:absolute;left:16px;top:44px;right:16px;display:flex;align-items:center;justify-content:space-between;">
    <button style="width:46px;height:46px;border:0;border-radius:23px;background:rgba(60,50,40,0.7);display:flex;align-items:center;justify-content:center;cursor:pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <div style="display:flex;align-items:center;gap:8px;background:#F2A03D;border-radius:999px;padding:9px 14px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#3F2718" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l9 16H3z"/><path d="M12 10v4"/></svg>
      <span style="font-size:12.5px;font-weight:700;color:#3F2718;">Too dark to track</span>
    </div>
    <div style="width:46px;"></div>
  </div>

  <div style="position:absolute;left:0;bottom:0;width:412px;background:#FFFFFF;border-radius:30px 30px 0 0;padding:16px 20px 0 20px;box-sizing:border-box;box-shadow:0 -12px 32px rgba(0,0,0,0.4);">
    <div style="display:flex;justify-content:center;">
      <div style="width:40px;height:4px;border-radius:999px;background:#E2D5C6;"></div>
    </div>

    <div style="display:flex;gap:14px;align-items:flex-start;margin-top:18px;">
      <div style="width:52px;height:52px;border-radius:18px;background:#FAEEDA;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#B4761A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3L5 14h5l-1 7 8-11h-5l1-7z"/></svg>
      </div>
      <div>
        <div style="font-size:21px;font-weight:800;color:#2B1D14;letter-spacing:-0.4px;">It's too dark in there</div>
        <div style="margin-top:6px;font-size:14.5px;line-height:21px;color:#7C6857;text-wrap:pretty;">The camera can't see enough detail to hold its position. Turn on the torch, or move the crate somewhere brighter.</div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px;margin-top:18px;">
      <button style="height:56px;border:0;border-radius:28px;background:#A65C34;color:#FFFFFF;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 8px 20px rgba(166,92,52,0.28);">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"><path d="M13 3L5 14h5l-1 7 8-11h-5l1-7z"/></svg>
        Turn on the torch
      </button>
      <button style="height:54px;border:1.5px solid #E2D5C6;border-radius:27px;background:#FFFFFF;color:#5C4A3A;font-family:inherit;font-size:15.5px;font-weight:600;cursor:pointer;">Type the measurements</button>
    </div>

    <div style="text-align:center;font-size:12.5px;color:#A2907F;margin-top:12px;">Your first two edges are saved.</div>

    <div style="height:32px;"></div>
  </div>
</div>
</x-dc>
</body>
</html>
