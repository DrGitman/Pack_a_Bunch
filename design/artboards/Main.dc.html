<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
  body { margin:0; font-family:"Plus Jakarta Sans","Segoe UI",Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:#A65C34; } a:hover { color:#7C4223; }
</style>
</helmet>

<div style="width:412px;height:916px;overflow:hidden;background:#F7EFE6;display:flex;flex-direction:column;">

  <div style="height:30px;flex-shrink:0;"></div>

  <div style="display:flex;align-items:center;gap:10px;padding:8px 20px 0 20px;">
    <div style="width:38px;height:38px;border-radius:12px;background:#A65C34;display:flex;align-items:center;justify-content:center;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.2v9.6L12 21l-8-4.2V7.2z"/><path d="M4 7.2l8 4.2 8-4.2"/><path d="M12 11.4V21"/></svg>
    </div>
    <div style="font-size:17px;font-weight:700;color:#2B1D14;letter-spacing:-0.2px;">Pack a Bunch</div>
  </div>

  <div style="padding:22px 20px 0 20px;">
    <div style="background:#FFFFFF;border-radius:28px;padding:18px;box-shadow:0 10px 28px rgba(90,58,35,0.10),0 2px 6px rgba(90,58,35,0.05);">
      <div style="position:relative;background:#F5E4D6;border-radius:20px;height:262px;overflow:hidden;">
        <svg width="336" height="262" viewBox="0 0 336 262" fill="none" style="display:block;">
          <ellipse cx="168" cy="228" rx="118" ry="20" fill="#E7CFB6"/>
          <path d="M52 100 L168 44 L168 128 L52 184 Z" fill="#E3CDB2"/>
          <path d="M168 44 L284 100 L284 184 L168 128 Z" fill="#EEDCC6"/>
          <path d="M52 184 L168 128 L284 184 L168 240 Z" fill="#D9BE9E"/>

          <g>
            <path d="M120 143 L154 160 L120 177 L86 160 Z" fill="#C9714A"/>
            <path d="M86 160 L120 177 L120 217 L86 200 Z" fill="#A85433"/>
            <path d="M120 177 L154 160 L154 200 L120 217 Z" fill="#8E4326"/>
          </g>
          <g>
            <path d="M120 103 L148 117 L120 131 L92 117 Z" fill="#5B8F72"/>
            <path d="M92 117 L120 131 L120 159 L92 145 Z" fill="#3F7A5A"/>
            <path d="M120 131 L148 117 L148 145 L120 159 Z" fill="#33654A"/>
          </g>
          <g>
            <path d="M204 152 L230 165 L204 178 L178 165 Z" fill="#5C7DBB"/>
            <path d="M178 165 L204 178 L204 210 L178 197 Z" fill="#3C5C9E"/>
            <path d="M204 178 L230 165 L230 197 L204 210 Z" fill="#324E86"/>
          </g>

          <path d="M52 100 L168 44 L168 128 L52 184 Z" fill="none" stroke="#C9A984" stroke-width="1.4"/>
          <path d="M52 100 L168 156 L284 100" fill="none" stroke="#C9A984" stroke-width="1.4" opacity="0.45"/>
          <path d="M52 100 L168 156 L168 240 L52 184 Z" fill="#B4713F" opacity="0.97"/>
          <path d="M168 156 L284 100 L284 184 L168 240 Z" fill="#99552C"/>
          <path d="M52 100 L168 44 L284 100 L168 156 Z" fill="none" stroke="#8E4E28" stroke-width="2.4" stroke-linejoin="round"/>
          <path d="M52 100 L168 156 L284 100" fill="none" stroke="#7C4223" stroke-width="2" stroke-linejoin="round"/>
          <path d="M52 100 L52 184 M168 156 L168 240 M284 100 L284 184" stroke="#7C4223" stroke-width="2" stroke-linecap="round"/>
        </svg>

        <div style="position:absolute;left:14px;top:16px;display:flex;align-items:center;gap:7px;background:#FFFFFF;border-radius:999px;padding:7px 12px;box-shadow:0 4px 12px rgba(90,58,35,0.14);">
          <span style="width:7px;height:7px;border-radius:999px;background:#3F7A5A;display:block;"></span>
          <span style="font-family:'DM Mono',ui-monospace,monospace;font-size:12px;color:#2B1D14;letter-spacing:0.2px;">58 × 40 × 35 cm</span>
        </div>
        <div style="position:absolute;right:14px;bottom:16px;display:flex;align-items:center;gap:7px;background:#4A2E1F;border-radius:999px;padding:7px 12px;">
          <span style="font-size:12px;font-weight:600;color:#F7EFE6;">3 of 3 placed</span>
        </div>
      </div>
    </div>
  </div>

  <div style="padding:26px 20px 0 20px;">
    <div style="font-size:33px;line-height:39px;font-weight:800;color:#2B1D14;letter-spacing:-1px;text-wrap:pretty;">Know what fits.<br>See where it goes.</div>
    <div style="margin-top:12px;font-size:15px;line-height:23px;color:#7C6857;text-wrap:pretty;">Measure a space, add your things, and get a packing order you can actually follow.</div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:10px;padding:20px 20px 0 20px;">
    <div style="background:#FFFFFF;border-radius:18px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(90,58,35,0.06);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A65C34" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l6-6 12 12-6 6z"/><path d="M8 8l2 2M11 5l2 2M5 11l2 2"/></svg>
      <span style="font-size:12.5px;font-weight:600;color:#2B1D14;">Measure</span>
    </div>
    <div style="background:#FFFFFF;border-radius:18px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(90,58,35,0.06);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A65C34" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>
      <span style="font-size:12.5px;font-weight:600;color:#2B1D14;">Plan</span>
    </div>
    <div style="background:#FFFFFF;border-radius:18px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(90,58,35,0.06);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A65C34" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      <span style="font-size:12.5px;font-weight:600;color:#2B1D14;">Pack</span>
    </div>
  </div>

  <div style="flex-grow:1;"></div>

  <div style="display:flex;flex-direction:column;gap:10px;padding:0 20px;">
    <button style="height:56px;border:0;border-radius:28px;background:#A65C34;color:#FFFFFF;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 8px 20px rgba(166,92,52,0.28);">Plan a pack</button>
    <button style="height:54px;border:1.5px solid #DCC6AF;border-radius:27px;background:transparent;color:#7C4223;font-family:inherit;font-size:15.5px;font-weight:600;cursor:pointer;">Try a sample pack</button>
    <div style="text-align:center;font-size:12.5px;color:#A2907F;padding:6px 0 0 0;">Your packs, on every phone you sign in to</div>
  </div>

  <div style="height:26px;flex-shrink:0;"></div>
</div>
</x-dc>
</body>
</html>
