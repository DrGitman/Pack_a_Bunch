  <div style="position:absolute;left:0;top:0;width:412px;height:200px;background:linear-gradient(180deg, rgba(20,16,12,0.62), rgba(20,16,12,0));"></div>

  <div style="position:absolute;left:16px;top:44px;right:16px;display:flex;align-items:center;justify-content:space-between;">
    <button style="width:46px;height:46px;border:0;border-radius:23px;background:rgba(30,24,18,0.6);display:flex;align-items:center;justify-content:center;cursor:pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <div style="display:flex;align-items:center;gap:8px;background:rgba(30,24,18,0.6);border-radius:999px;padding:9px 14px;">
      <span style="width:8px;height:8px;border-radius:999px;background:#6FD39B;display:block;"></span>
      <span style="font-size:12.5px;font-weight:600;color:#FFFFFF;">Tracking steady</span>
    </div>
    <button style="width:46px;height:46px;border:0;border-radius:23px;background:rgba(30,24,18,0.6);display:flex;align-items:center;justify-content:center;cursor:pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"><path d="M9.2 9a2.9 2.9 0 115.6 1c0 2-2.8 2.4-2.8 4.4"/><circle cx="12" cy="18" r="1" fill="#FFFFFF" stroke="none"/></svg>

  <div style="position:absolute;left:64px;top:452px;background:#FFFFFF;border-radius:999px;padding:6px 12px;box-shadow:0 6px 16px rgba(0,0,0,0.35);display:flex;align-items:center;gap:7px;">
    <span style="font-size:10.5px;font-weight:800;color:#8A7565;letter-spacing:0.5px;">W</span>
    <span style="font-family:'DM Mono',ui-monospace,monospace;font-size:14px;font-weight:500;color:#2B1D14;">58.4 cm</span>
  </div>
  <div style="position:absolute;left:254px;top:452px;background:#FFFFFF;border-radius:999px;padding:6px 12px;box-shadow:0 6px 16px rgba(0,0,0,0.35);display:flex;align-items:center;gap:7px;">
    <span style="font-size:10.5px;font-weight:800;color:#8A7565;letter-spacing:0.5px;">D</span>
    <span style="font-family:'DM Mono',ui-monospace,monospace;font-size:14px;font-weight:500;color:#2B1D14;">39.6 cm</span>
  </div>
  <div style="position:absolute;left:232px;top:600px;background:#F2A03D;border-radius:999px;padding:6px 12px;box-shadow:0 6px 16px rgba(0,0,0,0.35);display:flex;align-items:center;gap:7px;">
    <span style="font-size:10.5px;font-weight:800;color:#3F2718;letter-spacing:0.5px;">H</span>
    <span style="font-family:'DM Mono',ui-monospace,monospace;font-size:14px;font-weight:500;color:#3F2718;">34.8 cm</span>
  </div>

  <div style="position:absolute;right:18px;top:646px;display:flex;flex-direction:column;gap:12px;">
    <button style="width:52px;height:52px;border:0;border-radius:26px;background:rgba(30,24,18,0.62);display:flex;align-items:center;justify-content:center;cursor:pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFE7C4" stroke-width="1.9" stroke-linejoin="round"><path d="M13 3L5 14h5l-1 7 8-11h-5l1-7z"/></svg>
    </button>
    <button style="width:52px;height:52px;border:0;border-radius:26px;background:rgba(30,24,18,0.62);display:flex;align-items:center;justify-content:center;cursor:pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.4-2h7.2L17 8h3a1 1 0 011 1v9a1 1 0 01-1 1H4a1 1 0 01-1-1V9a1 1 0 011-1z"/><circle cx="12" cy="13.4" r="3.2"/></svg>
    </button>
  </div>

  <div style="position:absolute;left:0;bottom:0;width:412px;background:#FFFFFF;border-radius:30px 30px 0 0;padding:16px 20px 0 20px;box-sizing:border-box;box-shadow:0 -12px 32px rgba(0,0,0,0.28);">
    <div style="display:flex;justify-content:center;">
      <div style="width:40px;height:4px;border-radius:999px;background:#E2D5C6;"></div>
    </div>

    <div style="display:flex;align-items:center;gap:7px;margin-top:14px;">
      <span style="width:22px;height:5px;border-radius:999px;background:#3F7A5A;display:block;"></span>
      <span style="width:22px;height:5px;border-radius:999px;background:#3F7A5A;display:block;"></span>
      <span style="width:22px;height:5px;border-radius:999px;background:#F2A03D;display:block;"></span>
      <span style="font-size:12px;font-weight:600;color:#A2907F;margin-left:6px;">Edge 3 of 3</span>
    </div>

    <div style="margin-top:10px;font-size:21px;font-weight:800;color:#2B1D14;letter-spacing:-0.4px;">Now measure the height</div>
    <div style="margin-top:6px;font-size:14.5px;line-height:21px;color:#7C6857;text-wrap:pretty;">Tap the bottom inside corner, then the top edge of the same wall. Move slowly and keep the surface lit.</div>

    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;">
      <button style="height:52px;padding:0 18px;border:1.5px solid #E2D5C6;border-radius:26px;background:#FFFFFF;color:#5C4A3A;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5C4A3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h9a5 5 0 110 10H9"/><path d="M4 10l4-4M4 10l4 4"/></svg>
        Undo

      <button style="width:76px;height:76px;border:5px solid #F1E5D8;border-radius:38px;background:#A65C34;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 10px 22px rgba(166,92,52,0.35);">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </button>
      <button style="height:52px;padding:0 18px;border:1.5px solid #E2D5C6;border-radius:26px;background:#FFFFFF;color:#5C4A3A;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;">Type it</button>
    </div>

    <div style="height:34px;"></div>
