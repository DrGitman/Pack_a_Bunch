<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
  body { margin:0; font-family:"Plus Jakarta Sans","Segoe UI",Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:#A65C34; } a:hover { color:#7C4223; }
</style>
</helmet>

<div style="width:412px;height:916px;overflow:hidden;background:#2E2A26;position:relative;">

  <svg width="412" height="916" viewBox="0 0 412 916" fill="none" style="position:absolute;left:0;top:0;">
    <rect x="0" y="0" width="412" height="470" fill="#3B352F"/>
    <rect x="0" y="470" width="412" height="446" fill="#4A423A"/>
    <path d="M120 916 L188 470 M300 916 L232 470" stroke="#544C44" stroke-width="1.2" opacity="0.5"/>
    <ellipse cx="206" cy="700" rx="190" ry="52" fill="#3E372F" opacity="0.7"/>
    <path d="M76 495 L206 430 L206 510 L76 575 Z" fill="#6B5442" opacity="0.85"/>
    <path d="M206 430 L336 495 L336 575 L206 510 Z" fill="#7B6450" opacity="0.85"/>
    <path d="M76 575 L206 510 L336 575 L206 640 Z" fill="#4A3728" opacity="0.85"/>
    <path d="M76 495 L206 560 L206 710 L76 645 Z" fill="#5A4534" opacity="0.85"/>
    <path d="M206 560 L336 495 L336 645 L206 710 Z" fill="#48372A" opacity="0.85"/>
    <path d="M76 495 L206 430 L336 495 L206 560 Z" fill="none" stroke="#8A7259" stroke-width="2" stroke-linejoin="round" opacity="0.8"/>

    <g opacity="0.55">
      <circle cx="150" cy="600" r="2.2" fill="#F2A03D"/>
      <circle cx="196" cy="576" r="2.2" fill="#F2A03D"/>
      <circle cx="244" cy="604" r="2.2" fill="#F2A03D"/>
      <circle cx="180" cy="628" r="2.2" fill="#F2A03D"/>
      <circle cx="266" cy="562" r="2.2" fill="#F2A03D"/>
      <circle cx="118" cy="566" r="2.2" fill="#F2A03D"/>
    </g>
  </svg>

  <div style="position:absolute;left:0;top:0;width:412px;height:916px;background:rgba(22,18,14,0.42);"></div>

  <div style="position:absolute;left:16px;top:44px;right:16px;display:flex;align-items:center;justify-content:space-between;">
    <button style="width:46px;height:46px;border:0;border-radius:23px;background:rgba(30,24,18,0.62);display:flex;align-items:center;justify-content:center;cursor:pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <div style="display:flex;align-items:center;gap:8px;background:rgba(30,24,18,0.62);border-radius:999px;padding:9px 14px;">
      <span style="width:8px;height:8px;border-radius:999px;background:#F2A03D;display:block;"></span>
      <span style="font-size:12.5px;font-weight:600;color:#FFFFFF;">Finding the surface…</span>
    </div>
    <div style="width:46px;"></div>
  </div>

  <div style="position:absolute;left:0;top:330px;width:412px;display:flex;justify-content:center;">
    <svg width="200" height="150" viewBox="0 0 200 150" fill="none">
      <path d="M34 92 Q100 44 166 92" stroke="#F2A03D" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 9" fill="none"/>
      <path d="M158 82 L167 93 L155 99" stroke="#F2A03D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <g transform="rotate(-14 100 96)">
        <rect x="80" y="62" width="40" height="70" rx="8" fill="#FFFFFF" opacity="0.96"/>
        <rect x="86" y="70" width="28" height="46" rx="4" fill="#3B352F"/>
        <circle cx="100" cy="124" r="3" fill="#B9AA99"/>
      </g>
    </svg>
  </div>

  <div style="position:absolute;left:0;bottom:0;width:412px;background:#FFFFFF;border-radius:30px 30px 0 0;padding:16px 20px 0 20px;box-sizing:border-box;box-shadow:0 -12px 32px rgba(0,0,0,0.3);">
    <div style="display:flex;justify-content:center;">
      <div style="width:40px;height:4px;border-radius:999px;background:#E2D5C6;"></div>
    </div>

    <div style="margin-top:18px;font-size:22px;font-weight:800;color:#2B1D14;letter-spacing:-0.5px;">Move your phone slowly</div>
    <div style="margin-top:6px;font-size:14.5px;line-height:21px;color:#7C6857;text-wrap:pretty;">Sweep it side to side over the crate until the surface locks on. This takes a few seconds the first time.</div>

    <div style="display:flex;flex-direction:column;gap:9px;margin-top:16px;">
      <div style="display:flex;gap:11px;align-items:center;background:#F9F4EE;border-radius:16px;padding:12px 14px;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#B4761A" stroke-width="2" stroke-linecap="round" style="flex-shrink:0;"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
        <div style="font-size:13.5px;line-height:20px;color:#5C4A3A;">Good light helps more than anything else</div>
      </div>
      <div style="display:flex;gap:11px;align-items:center;background:#F9F4EE;border-radius:16px;padding:12px 14px;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#B4761A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M4 8V5a1 1 0 011-1h3M20 8V5a1 1 0 00-1-1h-3M4 16v3a1 1 0 001 1h3M20 16v3a1 1 0 01-1 1h-3"/></svg>
        <div style="font-size:13.5px;line-height:20px;color:#5C4A3A;">Keep the whole crate in the frame</div>
      </div>
      <div style="display:flex;gap:11px;align-items:center;background:#F9F4EE;border-radius:16px;padding:12px 14px;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#B4761A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M12 4l2.2 4.6 5 .7-3.6 3.5.9 5-4.5-2.4-4.5 2.4.9-5L4.8 9.3l5-.7z"/></svg>
        <div style="font-size:13.5px;line-height:20px;color:#5C4A3A;">Shiny or plain walls are the hardest to read</div>
      </div>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;">
      <div style="width:52px;"></div>
      <div style="width:76px;height:76px;border:5px solid #F1E5D8;border-radius:38px;background:#DFD3C6;display:flex;align-items:center;justify-content:center;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#B0A091" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </div>
      <button style="height:52px;padding:0 14px;border:1.5px solid #E2D5C6;border-radius:26px;background:#FFFFFF;color:#5C4A3A;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;">Type it</button>
    </div>

    <div style="height:34px;"></div>
  </div>
</div>
</x-dc>
</body>
</html>
