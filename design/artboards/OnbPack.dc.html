<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
  body { margin:0; font-family:"Plus Jakarta Sans","Segoe UI",Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:#A65C34; } a:hover { color:#7C4223; }
</style>
</helmet>

<div style="width:412px;height:916px;overflow:hidden;background:#F7EFE6;display:flex;flex-direction:column;">

  <div style="height:30px;flex-shrink:0;"></div>

  <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 20px 0 20px;">
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="width:34px;height:34px;border-radius:11px;background:#A65C34;display:flex;align-items:center;justify-content:center;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.2v9.6L12 21l-8-4.2V7.2z"/><path d="M4 7.2l8 4.2 8-4.2"/><path d="M12 11.4V21"/></svg>
      </div>
      <div style="font-size:15.5px;font-weight:700;color:#2B1D14;">Pack a Bunch</div>
    </div>
    <button style="height:40px;padding:0 14px;border:0;border-radius:20px;background:transparent;color:#8A7565;font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;">Skip</button>
  </div>

  <div style="padding:26px 20px 0 20px;">
    <div style="background:#FFFFFF;border-radius:30px;padding:18px;box-shadow:0 12px 32px rgba(90,58,35,0.10);">
      <div style="background:#F5E4D6;border-radius:22px;height:300px;display:flex;align-items:center;justify-content:center;overflow:hidden;">
        <svg width="330" height="290" viewBox="0 0 330 290" fill="none">
          <rect x="26" y="26" width="278" height="66" rx="20" fill="#FFFFFF"/>
          <circle cx="62" cy="59" r="18" fill="#E1EEE7"/>
          <path d="M55 59 L60 65 L70 53" stroke="#3F7A5A" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <rect x="92" y="46" width="112" height="11" rx="5.5" fill="#DCCFC0"/>
          <rect x="92" y="65" width="72" height="9" rx="4.5" fill="#EADFD1"/>

          <rect x="26" y="104" width="278" height="82" rx="20" fill="#FFFFFF" stroke="#A65C34" stroke-width="2.6"/>
          <circle cx="62" cy="145" r="18" fill="#A65C34"/>
          <text x="62" y="151" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">2</text>
          <rect x="92" y="126" width="132" height="12" rx="6" fill="#C7B4A2"/>
          <rect x="92" y="147" width="96" height="9" rx="4.5" fill="#EADFD1"/>
          <rect x="92" y="162" width="64" height="9" rx="4.5" fill="#EADFD1"/>
          <g>
            <path d="M258 122 L284 135 L258 148 L232 135 Z" fill="#5B8F72"/>
            <path d="M232 135 L258 148 L258 166 L232 153 Z" fill="#3F7A5A"/>
            <path d="M258 148 L284 135 L284 153 L258 166 Z" fill="#33654A"/>
          </g>

          <rect x="26" y="198" width="278" height="66" rx="20" fill="#FFFFFF" opacity="0.7"/>
          <circle cx="62" cy="231" r="18" fill="#F0E5D9"/>
          <text x="62" y="237" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="16" font-weight="800" fill="#B09A85">3</text>
          <rect x="92" y="218" width="102" height="11" rx="5.5" fill="#E7DCCE"/>
          <rect x="92" y="237" width="66" height="9" rx="4.5" fill="#F0E7DC"/>
        </svg>
      </div>
    </div>
  </div>

  <div style="padding:30px 20px 0 20px;">
    <div style="font-size:12.5px;font-weight:800;color:#A65C34;letter-spacing:1.2px;">STEP THREE</div>
    <div style="margin-top:12px;font-size:31px;line-height:38px;font-weight:800;color:#2B1D14;letter-spacing:-1px;text-wrap:pretty;">Follow it, one piece at a time</div>
    <div style="margin-top:12px;font-size:15px;line-height:23px;color:#7C6857;text-wrap:pretty;">Numbered steps in an order that keeps everything supported: which item, which way round, which corner it goes in.</div>
  </div>

  <div style="flex-grow:1;"></div>

  <div style="padding:0 20px;">
    <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:20px;">
        <span style="width:8px;height:8px;border-radius:999px;background:#DFCEB8;display:block;"></span>
        <span style="width:8px;height:8px;border-radius:999px;background:#DFCEB8;display:block;"></span>
        <span style="width:26px;height:8px;border-radius:999px;background:#A65C34;display:block;"></span>
        <span style="width:8px;height:8px;border-radius:999px;background:#DFCEB8;display:block;"></span>
    </div>
    <div style="text-align:center;font-size:12.5px;color:#A2907F;margin-bottom:14px;">Mark each piece as it goes in. Your place is saved.</div>
    <button style="width:100%;height:56px;border:0;border-radius:28px;background:#A65C34;color:#FFFFFF;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 8px 20px rgba(166,92,52,0.28);">Next</button>
  </div>

  <div style="height:28px;flex-shrink:0;"></div>
</div>

</x-dc>
</body>
</html>
