<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
  body { margin:0; font-family:"Plus Jakarta Sans","Segoe UI",Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:#A65C34; } a:hover { color:#7C4223; }
</style>
</helmet>

<div style="width:412px;height:916px;overflow:hidden;background:#F7EFE6;position:relative;">

  <div style="padding:76px 20px 0 20px;display:flex;flex-direction:column;gap:10px;">
    <div style="height:80px;background:#FFFFFF;border-radius:22px;"></div>
    <div style="height:80px;background:#FFFFFF;border-radius:22px;"></div>
  </div>

  <div style="position:absolute;left:0;top:0;width:412px;height:916px;background:rgba(43,29,20,0.48);"></div>

  <div style="position:absolute;left:0;bottom:0;width:412px;background:#FFFFFF;border-radius:30px 30px 0 0;box-sizing:border-box;padding:14px 20px 0 20px;box-shadow:0 -14px 40px rgba(43,29,20,0.24);">

    <div style="display:flex;justify-content:center;">
      <div style="width:40px;height:4px;border-radius:999px;background:#E2D5C6;"></div>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:14px;">
      <div style="font-size:22px;font-weight:800;color:#2B1D14;letter-spacing:-0.4px;">Add an item</div>
      <button style="width:40px;height:40px;border:0;border-radius:20px;background:#F4EDE4;display:flex;align-items:center;justify-content:center;cursor:pointer;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#5C4A3A" stroke-width="2.1" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div style="background:#FDF3F1;border-radius:22px;padding:16px;margin-top:16px;">
      <div style="display:flex;gap:12px;align-items:flex-start;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#B4402B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px;"><path d="M12 4l9 16H3z"/><path d="M12 10v4"/><circle cx="12" cy="17" r="0.9" fill="#B4402B" stroke="none"/></svg>
        <div>
          <div style="font-size:15px;font-weight:700;color:#8E3322;">Too big for this crate</div>
          <div style="font-size:13.5px;line-height:20px;color:#8E3322;margin-top:5px;text-wrap:pretty;">At <span style="font-family:'DM Mono',ui-monospace,monospace;">62 cm</span> wide it won't go into a crate that is <span style="font-family:'DM Mono',ui-monospace,monospace;">58.4 cm</span> across, whichever way you turn it.</div>
        </div>
      </div>
      <div style="background:#FFFFFF;border-radius:14px;padding:12px;margin-top:12px;">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <span style="font-size:12.5px;font-weight:700;color:#8A7565;">Longest item edge</span>
          <span style="font-family:'DM Mono',ui-monospace,monospace;font-size:14px;color:#B4402B;">62.0 cm</span>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;">
          <span style="font-size:12.5px;font-weight:700;color:#8A7565;">Longest crate edge</span>
          <span style="font-family:'DM Mono',ui-monospace,monospace;font-size:14px;color:#2B1D14;">58.4 cm</span>
        </div>
      </div>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:20px;">
      <div style="font-size:15px;font-weight:700;color:#2B1D14;">Size, at its widest points</div>
      <div style="display:flex;background:#F4EDE4;border-radius:999px;padding:3px;">
        <div style="background:#FFFFFF;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;color:#2B1D14;box-shadow:0 1px 3px rgba(90,58,35,0.12);">cm</div>
        <div style="padding:5px 12px;font-size:12px;font-weight:600;color:#9E8B79;">in</div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:9px;margin-top:11px;">
      <div style="background:#FDF3F1;border:2px solid #B4402B;border-radius:16px;padding:11px 12px;">
        <div style="font-size:11.5px;font-weight:700;color:#B4402B;">Width</div>
        <div style="font-family:'DM Mono',ui-monospace,monospace;font-size:19px;color:#2B1D14;margin-top:4px;">62</div>
      </div>
      <div style="background:#F9F4EE;border:1.5px solid #EADCCC;border-radius:16px;padding:11px 12px;">
        <div style="font-size:11.5px;font-weight:700;color:#8A7565;">Depth</div>
        <div style="font-family:'DM Mono',ui-monospace,monospace;font-size:19px;color:#2B1D14;margin-top:4px;">28</div>
      </div>
      <div style="background:#F9F4EE;border:1.5px solid #EADCCC;border-radius:16px;padding:11px 12px;">
        <div style="font-size:11.5px;font-weight:700;color:#8A7565;">Height</div>
        <div style="font-family:'DM Mono',ui-monospace,monospace;font-size:19px;color:#2B1D14;margin-top:4px;">18</div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:9px;margin-top:18px;">
      <button style="height:54px;border:0;border-radius:27px;background:#A65C34;color:#FFFFFF;font-family:inherit;font-size:15.5px;font-weight:700;cursor:pointer;box-shadow:0 8px 20px rgba(166,92,52,0.28);">Fix the width</button>
      <button style="height:52px;border:1.5px solid #E2D5C6;border-radius:26px;background:#FFFFFF;color:#5C4A3A;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;">Use a bigger space instead</button>
      <button style="height:46px;border:0;border-radius:23px;background:transparent;color:#7C4223;font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;">Save it anyway — it won't be placed</button>
    </div>

    <div style="height:28px;"></div>
  </div>
</div>
</x-dc>
</body>
</html>
