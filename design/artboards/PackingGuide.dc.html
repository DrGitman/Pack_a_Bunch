<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
  body { margin:0; font-family:"Plus Jakarta Sans","Segoe UI",Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:#A65C34; } a:hover { color:#7C4223; }
</style>
</helmet>

<div style="width:412px;height:916px;overflow:hidden;background:#F7EFE6;display:flex;flex-direction:column;">

  <div style="height:30px;flex-shrink:0;"></div>

  <div style="display:flex;align-items:center;gap:6px;padding:6px 12px 0 12px;">
    <button style="width:44px;height:44px;border:0;border-radius:22px;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B1D14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19l-7-7 7-7"/></svg>
    </button>
    <div style="flex-grow:1;font-size:18px;font-weight:700;color:#2B1D14;">Packing guide</div>
    <button style="width:44px;height:44px;border:0;border-radius:22px;background:#F0E5D9;display:flex;align-items:center;justify-content:center;cursor:pointer;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#5C4A3A" stroke-width="2.1" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <div style="padding:10px 20px 0 20px;">
    <div style="display:flex;gap:5px;">
      <div style="height:6px;flex-grow:1;border-radius:999px;background:#3F7A5A;"></div>
      <div style="height:6px;flex-grow:1;border-radius:999px;background:#3F7A5A;"></div>
      <div style="height:6px;flex-grow:1;border-radius:999px;background:#A65C34;"></div>
      <div style="height:6px;flex-grow:1;border-radius:999px;background:#E7DACA;"></div>
      <div style="height:6px;flex-grow:1;border-radius:999px;background:#E7DACA;"></div>
      <div style="height:6px;flex-grow:1;border-radius:999px;background:#E7DACA;"></div>
    </div>
    <div style="margin-top:9px;display:flex;align-items:center;justify-content:space-between;">
      <span style="font-size:12.5px;font-weight:700;color:#A2907F;letter-spacing:0.4px;">STEP 3 OF 6</span>
      <span style="font-size:12.5px;font-weight:600;color:#3F7A5A;">2 packed</span>
    </div>
  </div>

  <div style="padding:12px 20px 0 20px;">
    <div style="background:#FFFFFF;border-radius:28px;padding:14px;box-shadow:0 10px 28px rgba(90,58,35,0.09);">
      <div style="background:#F5E4D6;border-radius:22px;height:284px;overflow:hidden;display:flex;align-items:center;justify-content:center;">
        <svg width="348" height="278" viewBox="0 0 372 300" fill="none">
          <ellipse cx="186" cy="272" rx="150" ry="22" fill="#E7CFB6"/>
          <path d="M30 118 L186 40 L186 130 L30 208 Z" fill="#E3CDB2"/>
          <path d="M186 40 L342 118 L342 208 L186 130 Z" fill="#EFDECA"/>
          <path d="M30 208 L186 130 L342 208 L186 286 Z" fill="#D9BE9E"/>

          <g opacity="0.5">
            <path d="M112 144 L172 174 L112 204 L52 174 Z" fill="#C9714A"/>
            <path d="M52 174 L112 204 L112 248 L52 218 Z" fill="#A85433"/>
            <path d="M112 204 L172 174 L172 218 L112 248 Z" fill="#8E4326"/>
          </g>
          <g opacity="0.5">
            <path d="M218 176 L258 196 L218 216 L178 196 Z" fill="#5B8F72"/>
            <path d="M178 196 L218 216 L218 240 L178 220 Z" fill="#3F7A5A"/>
            <path d="M218 216 L258 196 L258 220 L218 240 Z" fill="#33654A"/>
          </g>

          <path d="M250 128 L286 146 L250 164 L214 146 Z" fill="none" stroke="#3F7A5A" stroke-width="2.6" stroke-dasharray="8 6" stroke-linejoin="round"/>
          <path d="M214 146 L250 164 L250 188 L214 170 Z" fill="none" stroke="#3F7A5A" stroke-width="2.6" stroke-dasharray="8 6" stroke-linejoin="round"/>
          <path d="M250 164 L286 146 L286 170 L250 188 Z" fill="none" stroke="#3F7A5A" stroke-width="2.6" stroke-dasharray="8 6" stroke-linejoin="round"/>

          <g>
            <path d="M250 44 L286 62 L250 80 L214 62 Z" fill="#5B8F72"/>
            <path d="M214 62 L250 80 L250 104 L214 86 Z" fill="#3F7A5A"/>
            <path d="M250 80 L286 62 L286 104 L250 122 Z" fill="#33654A"/>
            <circle cx="250" cy="62" r="14" fill="#FFFFFF"/>
            <text x="250" y="68" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="800" fill="#3F7A5A">2</text>
          </g>
          <path d="M250 128 L250 106" stroke="#3F7A5A" stroke-width="3" stroke-linecap="round"/>
          <path d="M243 120 L250 129 L257 120" stroke="#3F7A5A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

          <path d="M30 118 L186 196 L186 286 L30 208 Z" fill="#B4713F"/>
          <path d="M186 196 L342 118 L342 208 L186 286 Z" fill="#99552C"/>
          <path d="M30 118 L186 40 L342 118 L186 196 Z" fill="none" stroke="#8E4E28" stroke-width="2.6" stroke-linejoin="round"/>
          <path d="M30 118 L186 196 L342 118" fill="none" stroke="#7C4223" stroke-width="2.2"/>
          <path d="M30 118 L30 208 M186 196 L186 286 M342 118 L342 208" stroke="#7C4223" stroke-width="2.2" stroke-linecap="round"/>

          <rect x="292" y="88" width="58" height="22" rx="11" fill="#4A2E1F"/>
          <text x="321" y="103" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="800" fill="#F7EFE6">BACK</text>
          <rect x="286" y="212" width="66" height="22" rx="11" fill="#4A2E1F"/>
          <text x="319" y="227" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="800" fill="#F7EFE6">RIGHT</text>
        </svg>
      </div>
    </div>
  </div>

  <div style="padding:14px 20px 0 20px;">
    <div style="background:#FFFFFF;border-radius:26px;padding:18px;box-shadow:0 8px 22px rgba(90,58,35,0.08);">
      <div style="display:flex;align-items:center;gap:12px;">
        <div style="width:42px;height:42px;border-radius:14px;background:#3F7A5A;color:#FFFFFF;font-size:19px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;">2</div>
        <div style="flex-grow:1;">
          <div style="font-size:19px;font-weight:800;color:#2B1D14;letter-spacing:-0.3px;">Shoe box</div>
          <div style="font-family:'DM Mono',ui-monospace,monospace;font-size:12px;color:#8A7565;margin-top:2px;">33 × 20 × 12 cm · 2nd of 3</div>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:11px;margin-top:16px;">
        <div style="display:flex;gap:11px;align-items:flex-start;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A65C34" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px;"><path d="M20 12a8 8 0 11-2.3-5.6"/><path d="M20 4v5h-5"/></svg>
          <div style="font-size:15px;line-height:22px;color:#2B1D14;">Lay it <strong>flat</strong>, long side running left to right.</div>
        </div>
        <div style="display:flex;gap:11px;align-items:flex-start;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A65C34" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px;"><path d="M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>
          <div style="font-size:15px;line-height:22px;color:#2B1D14;">Push it into the <strong>back right</strong> corner, touching both walls.</div>
        </div>
        <div style="display:flex;gap:11px;align-items:flex-start;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A65C34" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px;"><path d="M4 18h16M4 18V9M20 18V9"/><path d="M8 18v-5h8v5"/></svg>
          <div style="font-size:15px;line-height:22px;color:#2B1D14;">It sits on the crate floor, beside the shoe box you just placed.</div>
        </div>
      </div>
    </div>
  </div>

  <div style="flex-grow:1;"></div>

  <div style="padding:0 20px;">
    <div style="display:flex;gap:10px;">
      <button style="width:56px;height:56px;border:1.5px solid #DCC6AF;border-radius:28px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7C4223" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19l-7-7 7-7"/></svg>
      </button>
      <button style="flex-grow:1;height:56px;border:0;border-radius:28px;background:#A65C34;color:#FFFFFF;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 8px 20px rgba(166,92,52,0.28);display:flex;align-items:center;justify-content:center;gap:9px;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        It's in
      </button>
    </div>
    <button style="width:100%;height:48px;margin-top:6px;border:0;border-radius:24px;background:transparent;color:#7C4223;font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;">It doesn't fit here</button>
  </div>

  <div style="height:22px;flex-shrink:0;"></div>
</div>
</x-dc>
</body>
</html>
