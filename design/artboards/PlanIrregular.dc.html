<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
  body { margin:0; font-family:"Plus Jakarta Sans","Segoe UI",Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:#A65C34; } a:hover { color:#7C4223; }
</style>
</helmet>

<div style="width:412px;height:916px;overflow:hidden;background:#F7EFE6;display:flex;flex-direction:column;">

  <div style="height:30px;flex-shrink:0;"></div>

  <div style="display:flex;align-items:center;gap:6px;padding:6px 12px 0 12px;">
    <button style="width:44px;height:44px;border:0;border-radius:22px;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B1D14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19l-7-7 7-7"/></svg>
    </button>
    <div style="flex-grow:1;">
      <div style="font-size:18px;font-weight:700;color:#2B1D14;">Car boot</div>
      <div style="font-family:'DM Mono',ui-monospace,monospace;font-size:11.5px;color:#8A7565;">384 L mapped · 2 arches</div>
    </div>
    <button style="width:44px;height:44px;border:0;border-radius:22px;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#5C4A3A" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="5" r="0.6"/><circle cx="12" cy="12" r="0.6"/><circle cx="12" cy="19" r="0.6"/></svg>
    </button>
  </div>

  <div style="padding:10px 20px 0 20px;">
    <div style="display:flex;background:#F0E5D9;border-radius:999px;padding:4px;">
      <div style="flex-grow:1;text-align:center;background:#4A2E1F;border-radius:999px;padding:9px 0;font-size:13px;font-weight:700;color:#F7EFE6;">From above</div>
      <div style="flex-grow:1;text-align:center;padding:9px 0;font-size:13px;font-weight:600;color:#8A7565;">In 3D</div>
    </div>
  </div>

  <div style="padding:14px 20px 0 20px;">
    <div style="background:#FFFFFF;border-radius:28px;padding:16px;box-shadow:0 10px 28px rgba(90,58,35,0.09);">
      <div style="background:#F5E4D6;border-radius:22px;padding:14px;">
        <div style="text-align:center;font-size:10.5px;font-weight:800;color:#9C7B58;letter-spacing:1px;">SEAT BACKS</div>
        <svg width="332" height="236" viewBox="0 0 332 236" fill="none" style="display:block;margin-top:6px;">
          <path d="M8 8 H324 V88 L286 104 V116 L324 132 V228 H8 V132 L46 116 V104 L8 88 Z" fill="#EFE1D0" stroke="#B98E63" stroke-width="2.4" stroke-linejoin="round"/>

          <path d="M324 88 L286 104 V116 L324 132" fill="#D9BE9E" stroke="none" opacity="0.55"/>
          <path d="M8 88 L46 104 V116 L8 132" fill="#D9BE9E" stroke="none" opacity="0.55"/>
          <text x="304" y="112" text-anchor="middle" font-family="DM Mono, monospace" font-size="9" fill="#8E6A45" transform="rotate(-90 304 112)">ARCH</text>
          <text x="28" y="112" text-anchor="middle" font-family="DM Mono, monospace" font-size="9" fill="#8E6A45" transform="rotate(-90 28 112)">ARCH</text>

          <rect x="14" y="14" width="150" height="68" rx="6" fill="#A65C34" opacity="0.17"/>
          <rect x="14" y="14" width="150" height="68" rx="6" fill="none" stroke="#A65C34" stroke-width="2.4"/>
          <circle cx="89" cy="48" r="16" fill="#A65C34"/>
          <text x="89" y="54" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">1</text>

          <rect x="170" y="14" width="148" height="68" rx="6" fill="#3F7A5A" opacity="0.17"/>
          <rect x="170" y="14" width="148" height="68" rx="6" fill="none" stroke="#3F7A5A" stroke-width="2.4"/>
          <circle cx="244" cy="48" r="16" fill="#3F7A5A"/>
          <text x="244" y="54" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">2</text>

          <rect x="52" y="88" width="228" height="44" rx="6" fill="#3C5C9E" opacity="0.17"/>
          <rect x="52" y="88" width="228" height="44" rx="6" fill="none" stroke="#3C5C9E" stroke-width="2.4"/>
          <circle cx="166" cy="110" r="15" fill="#3C5C9E"/>
          <text x="166" y="116" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">3</text>
          <text x="166" y="138" text-anchor="middle" font-family="DM Mono, monospace" font-size="10" fill="#2B4479">fits between the arches</text>

          <rect x="14" y="146" width="140" height="76" rx="6" fill="#B4761A" opacity="0.17"/>
          <rect x="14" y="146" width="140" height="76" rx="6" fill="none" stroke="#B4761A" stroke-width="2.4"/>
          <circle cx="84" cy="184" r="16" fill="#B4761A"/>
          <text x="84" y="190" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">4</text>

          <rect x="160" y="146" width="158" height="76" rx="6" fill="#6B4E9B" opacity="0.17"/>
          <rect x="160" y="146" width="158" height="76" rx="6" fill="none" stroke="#6B4E9B" stroke-width="2.4"/>
          <circle cx="239" cy="184" r="16" fill="#6B4E9B"/>
          <text x="239" y="190" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">5</text>
        </svg>
        <div style="text-align:center;font-size:10.5px;font-weight:800;color:#9C7B58;letter-spacing:1px;margin-top:4px;">TAILGATE — LOADS FROM HERE</div>
      </div>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:9px;padding:14px 20px 0 20px;">
    <div style="background:#FFFFFF;border-radius:20px;padding:13px 12px;box-shadow:0 6px 16px rgba(90,58,35,0.06);">
      <div style="font-family:'DM Mono',ui-monospace,monospace;font-size:21px;color:#2B1D14;">5/5</div>
      <div style="font-size:11.5px;font-weight:600;color:#8A7565;margin-top:3px;">pieces placed</div>
    </div>
    <div style="background:#FFFFFF;border-radius:20px;padding:13px 12px;box-shadow:0 6px 16px rgba(90,58,35,0.06);">
      <div style="font-family:'DM Mono',ui-monospace,monospace;font-size:21px;color:#2B1D14;">79%</div>
      <div style="font-size:11.5px;font-weight:600;color:#8A7565;margin-top:3px;">modelled fill</div>
    </div>
    <div style="background:#FFFFFF;border-radius:20px;padding:13px 12px;box-shadow:0 6px 16px rgba(90,58,35,0.06);">
      <div style="font-family:'DM Mono',ui-monospace,monospace;font-size:21px;color:#3F7A5A;">0</div>
      <div style="font-size:11.5px;font-weight:600;color:#8A7565;margin-top:3px;">left over</div>
    </div>
  </div>

  <div style="padding:12px 20px 0 20px;">
    <div style="background:#E1EEE7;border-radius:22px;padding:14px;display:flex;gap:12px;align-items:flex-start;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2C5B43" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px;"><path d="M20 6L9 17l-5-5"/></svg>
      <div style="font-size:13.5px;line-height:20px;color:#2C5B43;text-wrap:pretty;">Everything goes in, and every piece can be lifted in through the tailgate in this order.</div>
    </div>
  </div>

  <div style="flex-grow:1;"></div>

  <div style="padding:0 20px;">
    <button style="width:100%;height:56px;border:0;border-radius:28px;background:#A65C34;color:#FFFFFF;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 8px 20px rgba(166,92,52,0.28);">Start loading</button>
  </div>

  <div style="height:28px;flex-shrink:0;"></div>
</div>
</x-dc>
</body>
</html>
