<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
  body { margin:0; font-family:"Plus Jakarta Sans","Segoe UI",Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:#A65C34; } a:hover { color:#7C4223; }
</style>
</helmet>

<div style="width:412px;height:916px;overflow:hidden;background:#F7EFE6;display:flex;flex-direction:column;">

  <div style="height:30px;flex-shrink:0;"></div>

  <div style="display:flex;align-items:center;gap:6px;padding:6px 12px 0 12px;">
    <button style="width:44px;height:44px;border:0;border-radius:22px;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B1D14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19l-7-7 7-7"/></svg>
    </button>
    <div style="flex-grow:1;">
      <div style="font-size:18px;font-weight:700;color:#2B1D14;">Moving crate</div>
      <div style="font-family:'DM Mono',ui-monospace,monospace;font-size:11.5px;color:#8A7565;">58.4 × 39.6 × 35.0 cm</div>
    </div>
    <button style="width:44px;height:44px;border:0;border-radius:22px;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#5C4A3A" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="5" r="0.6"/><circle cx="12" cy="12" r="0.6"/><circle cx="12" cy="19" r="0.6"/></svg>
    </button>
  </div>

  <div style="padding:12px 20px 0 20px;">
    <div style="background:#FFFFFF;border-radius:28px;padding:14px;box-shadow:0 10px 28px rgba(90,58,35,0.09);position:relative;">
      <div style="background:#F5E4D6;border-radius:22px;height:300px;overflow:hidden;display:flex;align-items:center;justify-content:center;">
        <svg width="356" height="292" viewBox="0 0 372 300" fill="none">
          <ellipse cx="186" cy="272" rx="150" ry="22" fill="#E7CFB6"/>
          <path d="M30 118 L186 40 L186 130 L30 208 Z" fill="#E3CDB2"/>
          <path d="M186 40 L342 118 L342 208 L186 130 Z" fill="#EFDECA"/>
          <path d="M30 208 L186 130 L342 208 L186 286 Z" fill="#D9BE9E"/>

          <g>
            <path d="M150 111 L204 138 L150 165 L96 138 Z" fill="#5C7DBB"/>
            <path d="M96 138 L150 165 L150 178 L96 151 Z" fill="#3C5C9E"/>
            <path d="M150 165 L204 138 L204 151 L150 178 Z" fill="#324E86"/>
          </g>
          <g>
            <path d="M150 71 L204 98 L150 125 L96 98 Z" fill="#5C7DBB"/>
            <path d="M96 98 L150 125 L150 138 L96 111 Z" fill="#3C5C9E"/>
            <path d="M150 125 L204 98 L204 111 L150 138 Z" fill="#324E86"/>
          </g>
          <g>
            <path d="M250 128 L286 146 L250 164 L214 146 Z" fill="#5B8F72"/>
            <path d="M214 146 L250 164 L250 188 L214 170 Z" fill="#3F7A5A"/>
            <path d="M250 164 L286 146 L286 170 L250 188 Z" fill="#33654A"/>
          </g>
          <g>
            <path d="M112 144 L172 174 L112 204 L52 174 Z" fill="#C9714A"/>
            <path d="M52 174 L112 204 L112 248 L52 218 Z" fill="#A85433"/>
            <path d="M112 204 L172 174 L172 218 L112 248 Z" fill="#8E4326"/>
          </g>
          <g>
            <path d="M218 176 L258 196 L218 216 L178 196 Z" fill="#5B8F72"/>
            <path d="M178 196 L218 216 L218 240 L178 220 Z" fill="#3F7A5A"/>
            <path d="M218 216 L258 196 L258 220 L218 240 Z" fill="#33654A"/>
          </g>
          <g>
            <path d="M218 132 L258 152 L218 172 L178 152 Z" fill="#5B8F72"/>
            <path d="M178 152 L218 172 L218 196 L178 176 Z" fill="#3F7A5A"/>
            <path d="M218 172 L258 152 L258 176 L218 196 Z" fill="#33654A"/>
          </g>

          <path d="M30 118 L186 196 L186 286 L30 208 Z" fill="#B4713F"/>
          <path d="M186 196 L342 118 L342 208 L186 286 Z" fill="#99552C"/>
          <path d="M30 118 L186 40 L342 118 L186 196 Z" fill="none" stroke="#8E4E28" stroke-width="2.6" stroke-linejoin="round"/>
          <path d="M30 118 L186 196 L342 118" fill="none" stroke="#7C4223" stroke-width="2.2"/>
          <path d="M30 118 L30 208 M186 196 L186 286 M342 118 L342 208" stroke="#7C4223" stroke-width="2.2" stroke-linecap="round"/>

          <g>
            <circle cx="112" cy="174" r="13" fill="#FFFFFF"/>
            <text x="112" y="179" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="800" fill="#A85433">1</text>
          </g>
          <g>
            <circle cx="218" cy="152" r="12" fill="#FFFFFF"/>
            <text x="218" y="157" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="800" fill="#3F7A5A">2</text>
          </g>
          <g>
            <circle cx="250" cy="146" r="12" fill="#FFFFFF"/>
            <text x="250" y="151" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="800" fill="#3F7A5A">2</text>
          </g>
          <g>
            <circle cx="150" cy="98" r="12" fill="#FFFFFF"/>
            <text x="150" y="103" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="800" fill="#3C5C9E">3</text>
          </g>
        </svg>
      </div>

      <div style="position:absolute;left:26px;top:26px;display:flex;background:rgba(255,255,255,0.94);border-radius:999px;padding:4px;box-shadow:0 4px 14px rgba(90,58,35,0.14);">
        <div style="background:#4A2E1F;border-radius:999px;padding:8px 15px;font-size:12.5px;font-weight:700;color:#F7EFE6;">Overview</div>
        <div style="padding:8px 15px;font-size:12.5px;font-weight:600;color:#8A7565;">Layers</div>
      </div>

      <div style="position:absolute;right:26px;top:26px;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.94);border-radius:999px;padding:8px 12px;box-shadow:0 4px 14px rgba(90,58,35,0.14);">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8A7565" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 11-2.3-5.6"/><path d="M20 4v5h-5"/></svg>
        <span style="font-size:11.5px;font-weight:600;color:#7C6857;">Drag to turn</span>
      </div>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:9px;padding:14px 20px 0 20px;">
    <div style="background:#FFFFFF;border-radius:20px;padding:13px 12px;box-shadow:0 6px 16px rgba(90,58,35,0.06);">
      <div style="font-family:'DM Mono',ui-monospace,monospace;font-size:21px;color:#2B1D14;">6/7</div>
      <div style="font-size:11.5px;font-weight:600;color:#8A7565;margin-top:3px;">pieces placed</div>
    </div>
    <div style="background:#FFFFFF;border-radius:20px;padding:13px 12px;box-shadow:0 6px 16px rgba(90,58,35,0.06);">
      <div style="font-family:'DM Mono',ui-monospace,monospace;font-size:21px;color:#2B1D14;">71%</div>
      <div style="font-size:11.5px;font-weight:600;color:#8A7565;margin-top:3px;">modelled fill</div>
    </div>
    <div style="background:#FFFFFF;border-radius:20px;padding:13px 12px;box-shadow:0 6px 16px rgba(90,58,35,0.06);">
      <div style="font-family:'DM Mono',ui-monospace,monospace;font-size:21px;color:#B4402B;">1</div>
      <div style="font-size:11.5px;font-weight:600;color:#8A7565;margin-top:3px;">left over</div>
    </div>
  </div>

  <div style="padding:12px 20px 0 20px;">
    <div style="background:#FAEEDA;border-radius:22px;padding:14px;">
      <div style="display:flex;align-items:center;gap:10px;">
        <div style="width:30px;height:30px;border-radius:10px;background:#B4761A;display:flex;align-items:center;justify-content:center;color:#FFFFFF;font-size:13px;font-weight:800;flex-shrink:0;">4</div>
        <div style="flex-grow:1;">
          <div style="font-size:14.5px;font-weight:700;color:#2B1D14;">Camping stove didn't fit</div>
          <div style="font-family:'DM Mono',ui-monospace,monospace;font-size:11.5px;color:#8A6A2E;margin-top:2px;">36 × 30 × 11 cm</div>
        </div>
      </div>
      <div style="font-size:13.5px;line-height:20px;color:#7A5A25;margin-top:10px;text-wrap:pretty;">This arrangement couldn't place it. Try allowing it to lie flat, or take out one shoe box. That doesn't prove it can never fit.</div>
    </div>
  </div>

  <div style="flex-grow:1;"></div>

  <div style="padding:0 20px;display:flex;gap:10px;">
    <button style="width:56px;height:56px;border:1.5px solid #DCC6AF;border-radius:28px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#7C4223" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10-10-4-4L4 16z"/><path d="M14 6l4 4"/></svg>
    </button>
    <button style="flex-grow:1;height:56px;border:0;border-radius:28px;background:#A65C34;color:#FFFFFF;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 8px 20px rgba(166,92,52,0.28);">Start packing</button>
  </div>

  <div style="height:28px;flex-shrink:0;"></div>
</div>
</x-dc>
</body>
</html>
