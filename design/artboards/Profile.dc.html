<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
  body { margin:0; font-family:"Plus Jakarta Sans","Segoe UI",Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:#A65C34; } a:hover { color:#7C4223; }
</style>
</helmet>

<div style="width:412px;height:916px;overflow:hidden;background:#F7EFE6;display:flex;flex-direction:column;">

  <div style="height:30px;flex-shrink:0;"></div>

  <div style="display:flex;align-items:center;gap:6px;padding:6px 12px 0 12px;">
    <button style="width:44px;height:44px;border:0;border-radius:22px;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B1D14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19l-7-7 7-7"/></svg>
    </button>
    <div style="flex-grow:1;font-size:18px;font-weight:700;color:#2B1D14;">Account</div>
    <button style="width:44px;height:44px;border:0;border-radius:22px;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5C4A3A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10-10-4-4L4 16z"/><path d="M14 6l4 4"/></svg>
    </button>
  </div>

  <div style="padding:16px 20px 0 20px;">
    <div style="background:#FFFFFF;border-radius:28px;padding:20px;box-shadow:0 10px 26px rgba(90,58,35,0.08);">
      <div style="display:flex;gap:15px;align-items:center;">
        <div style="width:68px;height:68px;border-radius:24px;background:#A65C34;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <span style="font-size:26px;font-weight:800;color:#FFFFFF;letter-spacing:-0.5px;">O</span>
        </div>
        <div style="flex-grow:1;min-width:0;">
          <div style="font-size:19px;font-weight:800;color:#2B1D14;letter-spacing:-0.4px;">Orilio</div>
          <div style="font-size:13.5px;color:#8A7565;margin-top:3px;">orili@example.com</div>
          <div style="display:inline-flex;align-items:center;gap:6px;background:#F5E4D6;border-radius:999px;padding:5px 11px;margin-top:9px;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#7C4223" stroke-width="2.2" stroke-linejoin="round"><path d="M12 3l8 4.2v9.6L12 21l-8-4.2V7.2z"/></svg>
            <span style="font-size:11px;font-weight:800;color:#7C4223;letter-spacing:0.5px;">PACK PLUS</span>
          </div>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:10px;margin-top:20px;padding-top:18px;border-top:1px solid #F2E9DE;">
        <div>
          <div style="font-family:'DM Mono',ui-monospace,monospace;font-size:21px;color:#2B1D14;">14</div>
          <div style="font-size:11.5px;font-weight:600;color:#8A7565;margin-top:3px;">packs</div>
        </div>
        <div>
          <div style="font-family:'DM Mono',ui-monospace,monospace;font-size:21px;color:#2B1D14;">62</div>
          <div style="font-size:11.5px;font-weight:600;color:#8A7565;margin-top:3px;">things measured</div>
        </div>
        <div>
          <div style="font-family:'DM Mono',ui-monospace,monospace;font-size:21px;color:#2B1D14;">9</div>
          <div style="font-size:11.5px;font-weight:600;color:#8A7565;margin-top:3px;">packed for real</div>
        </div>
      </div>
    </div>
  </div>

  <div style="padding:14px 20px 0 20px;">
    <div style="background:#FFFFFF;border-radius:22px;padding:16px;display:flex;gap:13px;align-items:center;box-shadow:0 6px 18px rgba(90,58,35,0.06);">
      <div style="width:42px;height:42px;border-radius:14px;background:#E1EEE7;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#3F7A5A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 16.5H7a4.5 4.5 0 01-.9-8.9"/><path d="M8 6.7A5.2 5.2 0 0117 9h.3a3.8 3.8 0 012.7 6.4"/><path d="M12 12v7M9.4 16.4L12 19l2.6-2.6"/></svg>
      </div>
      <div style="flex-grow:1;">
        <div style="font-size:15px;font-weight:700;color:#2B1D14;">Backed up</div>
        <div style="font-size:12.5px;color:#8A7565;margin-top:2px;">A minute ago · 38 MB of photos</div>
      </div>
      <span style="font-size:11.5px;font-weight:700;color:#3F7A5A;background:#E1EEE7;border-radius:999px;padding:6px 11px;">ON</span>
    </div>
  </div>

  <div style="padding:20px 20px 0 20px;font-size:12.5px;font-weight:700;color:#A2907F;letter-spacing:0.8px;">ACCOUNT</div>

  <div style="padding:10px 20px 0 20px;">
    <div style="background:#FFFFFF;border-radius:22px;padding:6px 16px;box-shadow:0 6px 18px rgba(90,58,35,0.06);">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:15px 0;">
        <span style="font-size:15px;font-weight:600;color:#2B1D14;">Change email</span>
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#C3B0A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <div style="height:1px;background:#F2E9DE;"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:15px 0;">
        <span style="font-size:15px;font-weight:600;color:#2B1D14;">Change password</span>
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#C3B0A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <div style="height:1px;background:#F2E9DE;"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:15px 0;">
        <div>
          <div style="font-size:15px;font-weight:600;color:#2B1D14;">Manage Pack Plus</div>
          <div style="font-size:12.5px;color:#8A7565;margin-top:2px;">Renews 6 October in Google Play</div>
        </div>
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#C3B0A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5"/></svg>
      </div>
      <div style="height:1px;background:#F2E9DE;"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:15px 0;">
        <span style="font-size:15px;font-weight:600;color:#2B1D14;">Download my data</span>
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#C3B0A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>
    </div>
  </div>

  <div style="padding:14px 20px 0 20px;">
    <div style="background:#FFFFFF;border-radius:22px;padding:6px 16px;box-shadow:0 6px 18px rgba(90,58,35,0.06);">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:15px 0;">
        <span style="font-size:15px;font-weight:600;color:#5C4A3A;">Sign out</span>
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8A7565" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 17l5-5-5-5"/><path d="M20 12H9"/><path d="M12 4H6a2 2 0 00-2 2v12a2 2 0 002 2h6"/></svg>
      </div>
      <div style="height:1px;background:#F2E9DE;"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:15px 0;">
        <span style="font-size:15px;font-weight:600;color:#B4402B;">Delete account</span>
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#B4402B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M6 7l1 13h10l1-13"/></svg>
      </div>
    </div>
  </div>

  <div style="flex-grow:1;"></div>

  <div style="display:flex;justify-content:center;padding:0 20px 30px 20px;">
    <div style="display:flex;align-items:center;gap:6px;background:#3F2718;border-radius:34px;padding:8px 10px;box-shadow:0 12px 30px rgba(63,39,24,0.30);">
      <button style="width:52px;height:52px;border:0;border-radius:26px;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#C9B29E" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h7v7H4zM13 6h7v4h-7zM13 13h7v5h-7zM4 15h7v3H4z"/></svg>
      </button>
      <button style="width:56px;height:56px;border:0;border-radius:28px;background:#E08A46;display:flex;align-items:center;justify-content:center;cursor:pointer;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3F2718" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <div style="display:flex;align-items:center;gap:8px;background:#FFFFFF;border-radius:26px;height:52px;padding:0 20px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A65C34" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.4" r="3.6"/><path d="M5 19.5a7 7 0 0114 0"/></svg>
        <span style="font-size:14px;font-weight:700;color:#2B1D14;">You</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
