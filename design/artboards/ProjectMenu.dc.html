<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
  body { margin:0; font-family:"Plus Jakarta Sans","Segoe UI",Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:#A65C34; } a:hover { color:#7C4223; }
</style>
</helmet>

<div style="width:412px;height:916px;overflow:hidden;background:#F7EFE6;position:relative;">

  <div style="padding:76px 20px 0 20px;">
    <div style="font-size:28px;font-weight:800;color:#2B1D14;letter-spacing:-0.7px;">Projects</div>
    <div style="height:96px;background:#FFFFFF;border-radius:24px;margin-top:26px;"></div>
    <div style="height:96px;background:#FFFFFF;border-radius:24px;margin-top:12px;"></div>
    <div style="height:96px;background:#FFFFFF;border-radius:24px;margin-top:12px;"></div>
  </div>

  <div style="position:absolute;left:0;top:0;width:412px;height:916px;background:rgba(43,29,20,0.5);"></div>

  <div style="position:absolute;left:0;bottom:0;width:412px;background:#FFFFFF;border-radius:30px 30px 0 0;box-sizing:border-box;padding:14px 20px 0 20px;box-shadow:0 -14px 40px rgba(43,29,20,0.26);">

    <div style="display:flex;justify-content:center;">
      <div style="width:40px;height:4px;border-radius:999px;background:#E2D5C6;"></div>
    </div>

    <div style="display:flex;gap:14px;align-items:center;margin-top:18px;padding-bottom:16px;border-bottom:1px solid #F2E9DE;">
      <div style="width:60px;height:60px;border-radius:18px;background:#F5E4D6;flex-shrink:0;display:flex;align-items:center;justify-content:center;">
        <svg width="40" height="40" viewBox="0 0 60 60" fill="none">
          <path d="M8 24 L30 13 L52 24 L30 35 Z" fill="#E7CFB6"/>
          <path d="M8 24 L30 35 L30 49 L8 38 Z" fill="#B4713F"/>
          <path d="M30 35 L52 24 L52 38 L30 49 Z" fill="#99552C"/>
          <path d="M22 22 L30 26 L22 30 L14 26 Z" fill="#3F7A5A"/>
        </svg>
      </div>
      <div style="flex-grow:1;min-width:0;">
        <div style="font-size:18px;font-weight:800;color:#2B1D14;letter-spacing:-0.3px;">Moving crate</div>
        <div style="font-family:'DM Mono',ui-monospace,monospace;font-size:12px;color:#8A7565;margin-top:3px;">58.4 × 39.6 × 35.0 cm · 7 pieces</div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;padding-top:6px;">

      <div style="display:flex;align-items:center;gap:15px;padding:15px 2px;cursor:pointer;">
        <div style="width:42px;height:42px;border-radius:14px;background:#F4EDE4;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5C4A3A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10-10-4-4L4 16z"/><path d="M14 6l4 4"/></svg>
        </div>
        <div style="flex-grow:1;">
          <div style="font-size:15.5px;font-weight:600;color:#2B1D14;">Rename this pack</div>
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:15px;padding:15px 2px;cursor:pointer;">
        <div style="width:42px;height:42px;border-radius:14px;background:#F4EDE4;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5C4A3A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2.2"/><path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h2"/></svg>
        </div>
        <div style="flex-grow:1;">
          <div style="font-size:15.5px;font-weight:600;color:#2B1D14;">Duplicate it</div>
          <div style="font-size:12.5px;color:#8A7565;margin-top:2px;">Same space and items, fresh plan</div>
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:15px;padding:15px 2px;cursor:pointer;">
        <div style="width:42px;height:42px;border-radius:14px;background:#F4EDE4;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5C4A3A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l6-6 12 12-6 6z"/><path d="M8 8l2 2M11 5l2 2"/></svg>
        </div>
        <div style="flex-grow:1;">
          <div style="font-size:15.5px;font-weight:600;color:#2B1D14;">Measure the space again</div>
          <div style="font-size:12.5px;color:#8A7565;margin-top:2px;">Replans once you confirm the new size</div>
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:15px;padding:15px 2px;cursor:pointer;">
        <div style="width:42px;height:42px;border-radius:14px;background:#F4EDE4;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5C4A3A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M8 7l4-4 4 4"/><path d="M4 15v4a2 2 0 002 2h12a2 2 0 002-2v-4"/></svg>
        </div>
        <div style="flex-grow:1;">
          <div style="font-size:15.5px;font-weight:600;color:#2B1D14;">Share the packing list</div>
          <div style="font-size:12.5px;color:#8A7565;margin-top:2px;">Plain text, for whoever is helping</div>
        </div>
      </div>

      <div style="height:1px;background:#F2E9DE;margin:6px 0;"></div>

      <div style="display:flex;align-items:center;gap:15px;padding:15px 2px;cursor:pointer;">
        <div style="width:42px;height:42px;border-radius:14px;background:#FBE4DF;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B4402B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M6 7l1 13h10l1-13"/></svg>
        </div>
        <div style="flex-grow:1;">
          <div style="font-size:15.5px;font-weight:600;color:#B4402B;">Delete this pack</div>
          <div style="font-size:12.5px;color:#A57466;margin-top:2px;">Takes its items and photos with it</div>
        </div>
      </div>
    </div>

    <button style="width:100%;height:54px;margin-top:12px;border:1.5px solid #E2D5C6;border-radius:27px;background:#FFFFFF;color:#5C4A3A;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;">Close</button>

    <div style="height:30px;"></div>
  </div>
</div>
</x-dc>
</body>
</html>
