<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
  body { margin:0; font-family:"Plus Jakarta Sans","Segoe UI",Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:#A65C34; } a:hover { color:#7C4223; }
</style>
</helmet>

<div style="width:412px;height:916px;overflow:hidden;background:#F7EFE6;display:flex;flex-direction:column;">

  <div style="height:30px;flex-shrink:0;"></div>

  <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 20px 0 20px;">
    <div style="font-size:28px;font-weight:800;color:#2B1D14;letter-spacing:-0.7px;">Projects</div>
    <button style="width:44px;height:44px;border:0;border-radius:22px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 12px rgba(90,58,35,0.08);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5C4A3A" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h7M16 7h4M4 17h4M13 17h7"/><circle cx="13.5" cy="7" r="2.3"/><circle cx="10.5" cy="17" r="2.3"/></svg>
    </button>
  </div>

  <div style="padding:44px 20px 0 20px;display:flex;flex-direction:column;align-items:center;text-align:center;">
    <div style="width:180px;height:150px;background:#F0E5D9;border-radius:32px;display:flex;align-items:center;justify-content:center;">
      <svg width="132" height="110" viewBox="0 0 132 110" fill="none">
        <path d="M14 46 L66 20 L118 46 L66 72 Z" fill="#E4D5C2"/>
        <path d="M14 46 L66 72 L66 94 L14 68 Z" fill="#CDB79E" opacity="0.85"/>
        <path d="M66 72 L118 46 L118 68 L66 94 Z" fill="#BCA48A" opacity="0.85"/>
        <path d="M14 46 L66 20 L118 46 L66 72 Z" fill="none" stroke="#B79B79" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 6"/>
        <path d="M14 46 L14 68 M66 72 L66 94 M118 46 L118 68" stroke="#B79B79" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6"/>
      </svg>
    </div>
    <div style="margin-top:26px;font-size:22px;font-weight:800;color:#2B1D14;letter-spacing:-0.4px;">Nothing packed yet</div>
    <div style="margin-top:9px;font-size:15px;line-height:23px;color:#7C6857;max-width:290px;text-wrap:pretty;">Start with a space you can measure — a crate, a storage box, a drawer, a car boot.</div>
  </div>

  <div style="padding:26px 20px 0 20px;display:flex;flex-direction:column;gap:10px;">
    <button style="height:56px;border:0;border-radius:28px;background:#A65C34;color:#FFFFFF;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 8px 20px rgba(166,92,52,0.28);">New pack</button>
    <button style="height:54px;border:1.5px solid #DCC6AF;border-radius:27px;background:transparent;color:#7C4223;font-family:inherit;font-size:15.5px;font-weight:600;cursor:pointer;">Open the sample pack</button>
  </div>

  <div style="padding:28px 20px 0 20px;">
    <div style="background:#FFFFFF;border-radius:22px;padding:16px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 6px 18px rgba(90,58,35,0.06);">
      <div style="width:36px;height:36px;border-radius:12px;background:#F5E4D6;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#A65C34" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="7.8" r="0.9" fill="#A65C34" stroke="none"/></svg>
      </div>
      <div>
        <div style="font-size:14.5px;font-weight:700;color:#2B1D14;">Measure the inside</div>
        <div style="font-size:13.5px;line-height:20px;color:#7C6857;margin-top:3px;">Always measure the space inside the box, not the outside, and keep the opening clear.</div>
      </div>
    </div>
  </div>

  <div style="flex-grow:1;"></div>

  <div style="display:flex;justify-content:center;padding:0 20px 30px 20px;">
    <div style="display:flex;align-items:center;gap:6px;background:#3F2718;border-radius:34px;padding:8px 10px;box-shadow:0 12px 30px rgba(63,39,24,0.30);">
      <div style="display:flex;align-items:center;gap:8px;background:#FFFFFF;border-radius:26px;height:52px;padding:0 20px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A65C34" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h7v7H4zM13 6h7v4h-7zM13 13h7v5h-7zM4 15h7v3H4z"/></svg>
        <span style="font-size:14px;font-weight:700;color:#2B1D14;">Projects</span>
      </div>
      <button style="width:56px;height:56px;border:0;border-radius:28px;background:#E08A46;display:flex;align-items:center;justify-content:center;cursor:pointer;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3F2718" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button style="width:52px;height:52px;border:0;border-radius:26px;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#C9B29E" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h7M16 7h4M4 17h4M13 17h7"/><circle cx="13.5" cy="7" r="2.3"/><circle cx="10.5" cy="17" r="2.3"/></svg>
      </button>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
