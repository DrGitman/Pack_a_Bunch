<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
  body { margin:0; font-family:"Plus Jakarta Sans","Segoe UI",Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:#A65C34; } a:hover { color:#7C4223; }
</style>
</helmet>

<div style="width:412px;height:916px;overflow:hidden;background:#241F1B;position:relative;">

  <svg width="412" height="916" viewBox="0 0 412 916" fill="none" style="position:absolute;left:0;top:0;">
    <rect x="0" y="0" width="412" height="916" fill="#332D27"/>
    <path d="M0 250 L412 218 L412 700 L0 748 Z" fill="#4A4139"/>
    <path d="M0 250 L412 218 L412 300 L0 336 Z" fill="#3E3831"/>
    <path d="M0 618 L412 586 L412 700 L0 748 Z" fill="#554B42"/>
    <path d="M40 470 C96 440 128 520 84 556 L40 540 Z" fill="#443B34"/>
    <path d="M336 442 C388 414 412 490 372 526 L336 512 Z" fill="#443B34"/>
    <path d="M0 250 L412 218" stroke="#6B6055" stroke-width="1.6"/>
    <path d="M0 618 L412 586" stroke="#5E544B" stroke-width="1.4"/>

    <g fill="#6FD39B" opacity="0.85">
      <circle cx="58" cy="332" r="2.4"/><circle cx="112" cy="326" r="2.4"/><circle cx="166" cy="320" r="2.4"/>
      <circle cx="220" cy="314" r="2.4"/><circle cx="274" cy="308" r="2.4"/><circle cx="328" cy="302" r="2.4"/>
      <circle cx="58" cy="392" r="2.4"/><circle cx="112" cy="386" r="2.4"/><circle cx="166" cy="380" r="2.4"/>
      <circle cx="220" cy="374" r="2.4"/><circle cx="274" cy="368" r="2.4"/><circle cx="328" cy="362" r="2.4"/>
      <circle cx="58" cy="452" r="2.4"/><circle cx="112" cy="446" r="2.4"/><circle cx="166" cy="440" r="2.4"/>
      <circle cx="220" cy="434" r="2.4"/><circle cx="274" cy="428" r="2.4"/>
      <circle cx="112" cy="506" r="2.4"/><circle cx="166" cy="500" r="2.4"/><circle cx="220" cy="494" r="2.4"/>
      <circle cx="274" cy="488" r="2.4"/>
      <circle cx="166" cy="560" r="2.4"/><circle cx="220" cy="554" r="2.4"/><circle cx="274" cy="548" r="2.4"/>
    </g>
    <g stroke="#6FD39B" stroke-width="1" opacity="0.35">
      <path d="M58 332 L328 302 M58 392 L328 362 M58 452 L274 428 M112 506 L274 488"/>
      <path d="M58 332 L58 452 M112 326 L112 506 M166 320 L166 560 M220 314 L220 554 M274 308 L274 548 M328 302 L328 362"/>
    </g>

    <g fill="#F2A03D" opacity="0.5">
      <circle cx="330" cy="470" r="2.4"/><circle cx="356" cy="440" r="2.4"/><circle cx="330" cy="524" r="2.4"/>
    </g>
    <path d="M300 430 L392 430 L392 570 L300 570 Z" fill="none" stroke="#F2A03D" stroke-width="2.4" stroke-dasharray="9 7" rx="8"/>
  </svg>

  <div style="position:absolute;left:0;top:0;width:412px;height:200px;background:linear-gradient(180deg, rgba(18,14,11,0.72), rgba(18,14,11,0));"></div>

  <div style="position:absolute;left:16px;top:44px;right:16px;display:flex;align-items:center;justify-content:space-between;">
    <button style="width:46px;height:46px;border:0;border-radius:23px;background:rgba(30,24,18,0.6);display:flex;align-items:center;justify-content:center;cursor:pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <div style="display:flex;align-items:center;gap:9px;background:rgba(30,24,18,0.64);border-radius:999px;padding:8px 14px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="rgba(255,255,255,0.24)" stroke-width="3"/><path d="M12 3a9 9 0 018.3 5.5" stroke="#6FD39B" stroke-width="3" stroke-linecap="round"/><path d="M20.3 8.5a9 9 0 01-4.6 11.8" stroke="#6FD39B" stroke-width="3" stroke-linecap="round"/></svg>
      <span style="font-family:'DM Mono',ui-monospace,monospace;font-size:13px;color:#FFFFFF;">68% mapped</span>
    </div>
    <button style="width:46px;height:46px;border:0;border-radius:23px;background:rgba(30,24,18,0.6);display:flex;align-items:center;justify-content:center;cursor:pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFE7C4" stroke-width="1.9" stroke-linejoin="round"><path d="M13 3L5 14h5l-1 7 8-11h-5l1-7z"/></svg>
    </button>
  </div>

  <div style="position:absolute;left:0;top:388px;width:412px;display:flex;justify-content:center;">
    <div style="display:flex;align-items:center;gap:8px;background:#F2A03D;border-radius:999px;padding:9px 15px;box-shadow:0 6px 18px rgba(0,0,0,0.32);">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#3F2718" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span style="font-size:12.5px;font-weight:700;color:#3F2718;">Right side still thin — sweep there</span>
    </div>
  </div>

  <div style="position:absolute;left:0;bottom:0;width:412px;background:#FFFFFF;border-radius:30px 30px 0 0;padding:16px 20px 0 20px;box-sizing:border-box;box-shadow:0 -12px 32px rgba(0,0,0,0.32);">
    <div style="display:flex;justify-content:center;">
      <div style="width:40px;height:4px;border-radius:999px;background:#E2D5C6;"></div>
    </div>

    <div style="margin-top:16px;display:flex;align-items:center;justify-content:space-between;">
      <div style="font-size:21px;font-weight:800;color:#2B1D14;letter-spacing:-0.4px;">Sweep the whole boot</div>
      <span style="font-family:'DM Mono',ui-monospace,monospace;font-size:12.5px;color:#8A7565;">0:41</span>
    </div>
    <div style="margin-top:6px;font-size:14.5px;line-height:21px;color:#7C6857;text-wrap:pretty;">Move slowly along one side, across the back, then the other side. Green means we've got it.</div>

    <div style="height:8px;border-radius:999px;background:#F0E5D9;margin-top:16px;overflow:hidden;">
      <div style="width:68%;height:8px;border-radius:999px;background:#3F7A5A;"></div>
    </div>

    <div style="display:flex;gap:8px;margin-top:14px;">
      <div style="flex-grow:1;background:#E1EEE7;border-radius:14px;padding:10px 12px;">
        <div style="font-size:11px;font-weight:800;color:#2C5B43;letter-spacing:0.4px;">FLOOR</div>
        <div style="font-size:12.5px;font-weight:600;color:#2C5B43;margin-top:3px;">Mapped</div>
      </div>
      <div style="flex-grow:1;background:#E1EEE7;border-radius:14px;padding:10px 12px;">
        <div style="font-size:11px;font-weight:800;color:#2C5B43;letter-spacing:0.4px;">LEFT</div>
        <div style="font-size:12.5px;font-weight:600;color:#2C5B43;margin-top:3px;">Mapped</div>
      </div>
      <div style="flex-grow:1;background:#FAEEDA;border-radius:14px;padding:10px 12px;">
        <div style="font-size:11px;font-weight:800;color:#8A5A10;letter-spacing:0.4px;">RIGHT</div>
        <div style="font-size:12.5px;font-weight:600;color:#8A5A10;margin-top:3px;">Thin</div>
      </div>
    </div>

    <div style="display:flex;gap:10px;margin-top:16px;">
      <button style="height:54px;flex-grow:1;border:1.5px solid #E2D5C6;border-radius:27px;background:#FFFFFF;color:#5C4A3A;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;">Type it instead</button>
      <button style="height:54px;flex-grow:1;border:0;border-radius:27px;background:#DFD3C6;color:#A2907F;font-family:inherit;font-size:15.5px;font-weight:700;cursor:not-allowed;">Done</button>
    </div>
    <div style="text-align:center;font-size:12px;color:#A2907F;margin-top:10px;">Done unlocks at 80%.</div>

    <div style="height:28px;"></div>
  </div>
</div>
</x-dc>
</body>
</html>
