<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
  body { margin:0; font-family:"Plus Jakarta Sans","Segoe UI",Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:#A65C34; } a:hover { color:#7C4223; }
</style>
</helmet>

<div style="width:412px;height:916px;overflow:hidden;background:#F7EFE6;display:flex;flex-direction:column;">

  <div style="height:30px;flex-shrink:0;"></div>

  <div style="display:flex;align-items:center;gap:6px;padding:6px 16px 0 12px;">
    <button style="width:44px;height:44px;border:0;border-radius:22px;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B1D14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19l-7-7 7-7"/></svg>
    </button>
    <div style="font-size:18px;font-weight:700;color:#2B1D14;">What we mapped</div>
  </div>

  <div style="padding:14px 20px 0 20px;">
    <div style="background:#FFFFFF;border-radius:28px;padding:14px;box-shadow:0 10px 28px rgba(90,58,35,0.09);position:relative;">
      <div style="background:#F5E4D6;border-radius:22px;height:262px;display:flex;align-items:center;justify-content:center;overflow:hidden;">
        <svg width="340" height="250" viewBox="0 0 356 262" fill="none">
          <ellipse cx="178" cy="228" rx="146" ry="20" fill="#E7CFB6"/>
          <path d="M28 118 L150 62 L330 108 L330 162 L150 214 L28 176 Z" fill="#EFE1D0"/>
          <path d="M28 118 L150 158 L150 214 L28 176 Z" fill="#C08554"/>
          <path d="M150 158 L330 108 L330 162 L150 214 Z" fill="#A2673A"/>
          <path d="M28 118 L150 62 L330 108 L150 158 Z" fill="#E0CAAF"/>

          <path d="M58 150 C86 138 96 176 70 190 L58 184 Z" fill="#8E5A32"/>
          <path d="M244 138 C272 126 282 164 256 178 L244 172 Z" fill="#7C4B26"/>

          <path d="M28 118 L150 62 L330 108 L150 158 Z" fill="none" stroke="#8E4E28" stroke-width="2.2" stroke-linejoin="round"/>
          <path d="M28 118 L28 176 M150 158 L150 214 M330 108 L330 162" stroke="#7C4223" stroke-width="2" stroke-linecap="round"/>

          <path d="M150 62 L330 108" stroke="#3F7A5A" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/>
          <rect x="196" y="52" width="94" height="24" rx="12" fill="#3F7A5A"/>
          <text x="243" y="69" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">OPENING</text>

          <circle cx="74" cy="166" r="13" fill="#FFFFFF"/>
          <text x="74" y="171" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="800" fill="#8E5A32">1</text>
          <circle cx="260" cy="154" r="13" fill="#FFFFFF"/>
          <text x="260" y="159" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="800" fill="#7C4B26">2</text>
        </svg>
      </div>

      <div style="position:absolute;right:26px;top:26px;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.94);border-radius:999px;padding:8px 12px;box-shadow:0 4px 14px rgba(90,58,35,0.14);">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8A7565" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 11-2.3-5.6"/><path d="M20 4v5h-5"/></svg>
        <span style="font-size:11.5px;font-weight:600;color:#7C6857;">Drag to turn</span>
      </div>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:9px;padding:14px 20px 0 20px;">
    <div style="background:#FFFFFF;border-radius:20px;padding:13px 12px;box-shadow:0 6px 16px rgba(90,58,35,0.06);">
      <div style="font-family:'DM Mono',ui-monospace,monospace;font-size:19px;color:#2B1D14;">312 L</div>
      <div style="font-size:11.5px;font-weight:600;color:#8A7565;margin-top:3px;">usable volume</div>
    </div>
    <div style="background:#FFFFFF;border-radius:20px;padding:13px 12px;box-shadow:0 6px 16px rgba(90,58,35,0.06);">
      <div style="font-family:'DM Mono',ui-monospace,monospace;font-size:19px;color:#2B1D14;">96 cm</div>
      <div style="font-size:11.5px;font-weight:600;color:#8A7565;margin-top:3px;">widest run</div>
    </div>
    <div style="background:#FFFFFF;border-radius:20px;padding:13px 12px;box-shadow:0 6px 16px rgba(90,58,35,0.06);">
      <div style="font-family:'DM Mono',ui-monospace,monospace;font-size:19px;color:#2B1D14;">38 cm</div>
      <div style="font-size:11.5px;font-weight:600;color:#8A7565;margin-top:3px;">lowest ceiling</div>
    </div>
  </div>

  <div style="padding:18px 20px 0 20px;font-size:12.5px;font-weight:700;color:#A2907F;letter-spacing:0.8px;">THINGS IN THE WAY</div>

  <div style="padding:10px 20px 0 20px;display:flex;flex-direction:column;gap:9px;">
    <div style="background:#FFFFFF;border-radius:20px;padding:14px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 16px rgba(90,58,35,0.06);">
      <div style="width:30px;height:30px;border-radius:10px;background:#8E5A32;color:#FFFFFF;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;">1</div>
      <div style="flex-grow:1;">
        <div style="font-size:14.5px;font-weight:700;color:#2B1D14;">Wheel arch, left</div>
        <div style="font-family:'DM Mono',ui-monospace,monospace;font-size:11.5px;color:#8A7565;margin-top:2px;">intrudes 17 cm · 22 L lost</div>
      </div>
      <span style="font-size:11px;font-weight:700;color:#5C4A3A;background:#F4EDE4;border-radius:999px;padding:5px 10px;flex-shrink:0;">FIXED</span>
    </div>
    <div style="background:#FFFFFF;border-radius:20px;padding:14px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 16px rgba(90,58,35,0.06);">
      <div style="width:30px;height:30px;border-radius:10px;background:#7C4B26;color:#FFFFFF;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;">2</div>
      <div style="flex-grow:1;">
        <div style="font-size:14.5px;font-weight:700;color:#2B1D14;">Wheel arch, right</div>
        <div style="font-family:'DM Mono',ui-monospace,monospace;font-size:11.5px;color:#8A7565;margin-top:2px;">intrudes 17 cm · 22 L lost</div>
      </div>
      <span style="font-size:11px;font-weight:700;color:#5C4A3A;background:#F4EDE4;border-radius:999px;padding:5px 10px;flex-shrink:0;">FIXED</span>
    </div>
  </div>

  <div style="flex-grow:1;"></div>

  <div style="padding:0 20px;display:flex;gap:10px;">
    <button style="width:56px;height:56px;border:1.5px solid #DCC6AF;border-radius:28px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#7C4223" stroke-width="1.9" stroke-linecap="round"><path d="M20 12a8 8 0 11-2.3-5.6"/><path d="M20 4v5h-5"/></svg>
    </button>
    <button style="flex-grow:1;height:56px;border:0;border-radius:28px;background:#A65C34;color:#FFFFFF;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 8px 20px rgba(166,92,52,0.28);">What's staying in?</button>
  </div>

  <div style="height:28px;flex-shrink:0;"></div>
</div>
</x-dc>
</body>
</html>
